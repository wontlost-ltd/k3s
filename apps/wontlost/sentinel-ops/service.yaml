# Sentinel Ops Service
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ops
  namespace: wontlost-sentinel-ops
  labels:
    app: sentinel-ops
    app.kubernetes.io/name: sentinel-ops
    app.kubernetes.io/part-of: wontlost
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    app: sentinel-ops
