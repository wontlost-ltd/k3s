name: Secret scan

# 防止明文凭据再次进入本仓（issue #486 复盘项）。
#
# ★为什么需要：本 public 仓的 git 历史里曾有一个**生产** PG 账户的明文密码，
#   硬编码在两个 tracked 的 setup 脚本里约 2.5 个月。工作区已移除，但历史仍可检索。
#   移除提交自身就写明「public 仓明文泄露」——即团队已知悉，却没有任何机制
#   阻止下一次同类提交。本 workflow 补的正是这一层。
#
# ★范围声明（不要高估它）：本检查只防**新增**明文凭据，
#   **不清洗历史**、**不确认轮换**。issue #486 的第 1 步（确认旧密码已失效）
#   与第 2 步（filter-repo 清洗 + force-push）都涉及真实凭据与历史重写，
#   必须由维护者手工执行，不在 CI 范围内。
#
# ★用 `pull_request` 而非 `pull_request_target`：与本仓既有 workflow 同一约定。
#   pull_request_target 会以基分支权限运行、且能读到仓库 secret——对一个
#   要扫描 fork PR 内容的 job 而言那是最危险的组合。

on:
  pull_request:
  push:
    branches: [main]
  # 允许手工全量扫（默认只扫增量，见下）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 增量扫描需要 base commit 才能算 diff，故仍取全量历史；
          # 但**扫描范围**由 action 按 PR diff / push 增量决定，不是全量重扫
          # （见下面 step 的说明——全量会因历史遗留而永久红）。
          fetch-depth: 0

      # ★只扫**本次改动**，不扫全量历史。
      #   实测：全量历史扫出 3 处（正是 #486 那次泄露，至今仍可检索）；
      #   而当前工作区 `--no-git` 扫描 **0 处**。
      #   若让门禁扫全量历史，它会**永久红**直到历史被清洗——
      #   一个永远红的门禁最终会被人关掉或加 `continue-on-error`，
      #   等于没装。故此处只防「新增」，历史清洗是 #486 的独立步骤。
      - name: Run gitleaks (incremental — PR diff / new commits only)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不配 GITLEAKS_LICENSE：开源仓用免费档即可。
          # 扫到即失败（默认行为），不做 soft-fail——静默通过等于没装。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
