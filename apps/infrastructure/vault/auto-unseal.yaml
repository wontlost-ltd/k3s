# Vault Auto-Unseal CronJob
# Pod 重启后自动解封 Vault。
#
# ══ ★安全取舍（k3s#488，刻意记录而非默认无害）══════════════════════════
#
# 本方案把 3 把 unseal key 以普通 K8s Secret 存在**同一个集群**里，
# 且每 5 分钟自动解封。这意味着：
#
#   **seal 保护对「已取得集群内相应读权限的攻击者」实质失效。**
#
# seal 的设计目的是「即使拿到存储也读不到数据」。而 key 与密文同处一地时，
# 拿到 etcd/备份的人也就拿到了 key。这是自托管 Vault 的经典取舍：
# 要么接受它，要么上 KMS/云端 auto-unseal（transit / awskms / gcpckms）。
#
# ── 当前实测的暴露面（2026-09-05 全集群 SA 穷举）──────────────────
#
#   ★★**19 个 ServiceAccount 能读该 Secret**（不是"没有"——我第一版
#     只抽查了几个 SA 就下了"无任何 SA 能读"的结论，方向错得很危险：
#     它让风险看起来比实际小）。逐个 `auth can-i` 遍历全部 ns 的全部 SA 得：
#
#       argocd:argocd-application-controller / argocd:argocd-server
#       cert-manager:cert-manager / cert-manager:cert-manager-cainjector
#       cnpg-system:cloudnative-pg
#       cosign-system:policy-controller-webhook
#       external-secrets:external-secrets / :external-secrets-cert-controller
#       kube-system:expand-controller / :generic-garbage-collector
#       kube-system:helm-traefik / :helm-traefik-crd
#       kube-system:namespace-controller / :persistent-volume-binder
#       kube-system:traefik
#       monitoring:prometheus-grafana / :prometheus-kube-prometheus-operator
#       reflector:reflector
#       reloader:reloader-reloader
#
#   ★其中 prometheus-grafana / reloader / traefik / policy-controller 等
#     **与 vault 毫无职能关系** —— 它们能读 unseal key 是纯粹的过宽授权，
#     属**可低成本收敛的真实风险**，不是「职能所需」。
#     收敛这些无关 SA 的集群级 secrets 权限，成本远低于 KMS 迁移。
#
#   ✓ vault 自己的 SA **不能**读（vault-discovery-role 只有 pods 权限）——
#     ★kubelet 解析 secretKeyRef **不需要** SA 有 secrets 权限，这点常被误解
#     （已实证：SA=vault 的 Pod 对该 secret 的 API 读是 403，但 env 仍成功注入）
#   ✓ key 从未进入 git（工作区与全历史均 0 命中）
#   ✓ 无 velero 类备份 CR 覆盖 vault ns
#   ✓ 无残留明文副本（managedFields / events / 各类工作负载 spec 全扫，仅 data 一处）
#   ⚠ 拿到 etcd 快照/节点磁盘 = 拿到 key（这正是上面说的固有取舍）
#
# ── 未做（需要密钥仪式，不能由自动化代劳）──────────────────────────
#   · 迁移到 KMS auto-unseal —— 需选型 + 迁移 + 重新 init/rekey
#   · rekey 现有 3 把 key
#   两者都涉及 Vault 的不可逆操作与人工保管流程，必须人工执行。
#
# ══ 前置：Secret 需人工创建 ════════════════════════════════════════
#   kubectl create secret generic vault-unseal-keys -n vault \
#     --from-literal=UNSEAL_KEY_1="<key1>" \
#     --from-literal=UNSEAL_KEY_2="<key2>" \
#     --from-literal=UNSEAL_KEY_3="<key3>"
#
# ★务必用 `create` 而非 `apply`：`kubectl apply` 会把完整对象（含明文
#   key）写进 `kubectl.kubernetes.io/last-applied-configuration` 注解，
#   该注解与 data 字段**同样可读**，等于把 key 多存了一份明文副本。
#   实测本集群曾因此留下该注解（已单独清理，见 #488）。
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
  namespace: vault
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes (reduced from every minute)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # ★保留 3 个失败 Job 是刻意的（留证据），但它**不是告警**：
  #   实测曾有 3 个 DeadlineExceeded（8-19 ×2、8-26）静静躺了两周多无人发现，
  #   而它们恰好占满 limit=3，后续失败会把最早的挤掉。
  #   ★更糟的是：旧脚本对不可达/解封失败一律 exit 0，
  #     所以那三个是**仅有的**失败信号，且没人在看。
  #   本次改动让真实失败以 exit 1 呈现，失败 Job 才真正对应「出事了」。
  #   ⚠ 仍缺一条「Job 失败 → 告警」的链路（Prometheus 已部署，
  #     kube_job_failed 指标现成，但未配 rule）—— 属独立工作项。
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # ★50 → 240（2026-09-10，两次 DeadlineExceeded 后定位）
      #
      #   activeDeadlineSeconds **从 Job 创建即开始计时**，覆盖
      #   「调度等待 + 拉镜像 + 容器运行」全过程，而不只是脚本执行时间。
      #   实测脚本本体约 3s，看似 50s 有 16 倍余量——但那是镜像已缓存时。
      #
      #   实证根因：master-3 上**没有** hashicorp/vault:1.19.0 缓存
      #   （逐节点查 .status.images：master-1/2、worker-1 有，master-3 无）。
      #   本 Job 无 nodeSelector，调度到 master-3 时需现拉 ~161MiB 镜像；
      #   本地实测一次正常拉取 12.8s，网络慢/registry 限流时突破 50s 很容易。
      #   两次失败（09-08 21:40、09-09 09:15）均为 DeadlineExceeded，
      #   而 vault-0 已连续 43 天未重启且全程 Sealed=false —— 即 Vault
      #   本身从未出问题，失败纯属这条超时线画得太紧。
      #
      #   240s 的取舍：仍**远小于** 5 分钟调度周期，配合 concurrencyPolicy:
      #   Forbid 不会出现两个 Job 叠加；同时给「冷节点拉镜像」留足余量。
      #   ★这不会掩盖真实故障：脚本对「不可达」与「解封后仍 sealed」都是
      #     exit 1，会照常产生失败 Job 并触发 VaultUnsealJobFailed。
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: vault
          restartPolicy: Never
          containers:
          - name: unseal
            image: hashicorp/vault:1.19.0
            env:
            # ★不再用 VAULT_SKIP_VERIFY —— 那会让解封调用接受任何证书，
            #   而解封请求里带的正是 unseal key，是集群内最敏感的一次传输。
            #   改为验证 vault-internal-ca 签发的服务端证书。
            #   实测：该 CA 的 SAN 含 *.vault-internal，覆盖本 CronJob 用的
            #   vault-{0,1,2}.vault-internal，带验证访问 exit=0（与 skip 同）。
            #
            # ★不会因证书过期变成定时炸弹 —— 这是改这一处时最该问的问题：
            #   · 挂的是 **ca.crt**（CA 证书），有效期到 **2035-12-26**（10 年）
            #   · 服务端证书 vault-internal-tls 由 cert-manager 管理，
            #     duration=8760h / renewBefore=720h，**2026-11-28 自动续期**
            #     （提前 30 天），Certificate 状态 READY=True
            #   即：日常续期换的是服务端证书，而本处挂的 CA 不变。
            #   ★若将来 CA 轮换（2035 或提前重建），本挂载会随 Secret 更新自动跟上；
            #     但**若有人删掉或改名 vault-internal-tls**，解封会失败 ——
            #     那是 fail-closed（绝不会漏发 unseal key），但诊断信息在
            #     **Event 里而非容器日志**：Pod 卡 ContainerCreating、
            #     `kubectl logs` 返回空，需 `kubectl describe pod` 看
            #     "MountVolume.SetUp failed" / "references non-existent secret key"。
            #     （挂载成功但 CACERT 路径错才是 exit=1 + "Error loading CA File"，
            #      两者是不同的失败路径，排障时别混淆。）
            - name: VAULT_CACERT
              value: /vault/tls/ca.crt
            - name: UNSEAL_KEY_1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: UNSEAL_KEY_1
            - name: UNSEAL_KEY_2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: UNSEAL_KEY_2
            - name: UNSEAL_KEY_3
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: UNSEAL_KEY_3
            # ★补 resources（2026-09-10）：此前整个字段是空的（resources: {}），
            #   Pod 因此是 **BestEffort** QoS —— 节点内存吃紧时它排在最先被
            #   驱逐/挤占的一档。本 Job 是「Vault 封印后唯一的自动恢复路径」，
            #   恰恰不该是最先被牺牲的那个。
            #   实测本体只跑 `vault status` + 至多 3 次 unseal，占用极小；
            #   给出 requests 后 QoS 升为 Burstable，且不限制峰值（不设 cpu
            #   limit，避免 CFS 节流把 3s 的活拖长）。
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true
            command:
            - /bin/sh
            - -c
            - |
              set -u
              # ★不再 `for i in 0 1 2` —— StatefulSet 当前 replicas=1，
              #   循环会对不存在的 vault-1/vault-2 各产生一条
              #   "is not reachable"，**每 5 分钟两条**。
              #   那不是无害噪音：真有某个实例挂了，日志长得**一模一样**，
              #   于是「不可达」这条信号被自己的常态输出淹没，等于没有。
              #
              # ★副本数变化时的处置（写在这里免得下次又靠猜）：
              #   扩到 HA 多副本时，不要退回硬编码循环 —— 那会重蹈覆辙。
              #   应改为从 StatefulSet 实际副本数派生，或给每个副本单独探测
              #   并把「不可达」升级为**失败**（因为那时它确实是异常）。
              VAULT_ADDR="https://vault-0.vault-internal:8200"
              export VAULT_ADDR

              # Exit 0 = unsealed, Exit 2 = sealed, Exit 1 = error
              vault status > /dev/null 2>&1
              EXIT_CODE=$?

              if [ "$EXIT_CODE" = "2" ]; then
                echo "vault-0 is sealed (exit code 2), unsealing..."
                vault operator unseal "$UNSEAL_KEY_1" || true
                vault operator unseal "$UNSEAL_KEY_2" || true
                vault operator unseal "$UNSEAL_KEY_3" || true
                # ★复核解封结果并据此决定退出码 —— 原实现对三次 unseal 一律
                #   `|| true`，无论成败都以 0 退出，于是「解封失败」从不产生
                #   失败信号（Job 永远 succeeded）。
                vault status > /dev/null 2>&1
                if [ $? -eq 0 ]; then
                  echo "vault-0 unseal complete"
                else
                  echo "vault-0 STILL SEALED after unseal attempt" >&2
                  exit 1
                fi
              elif [ "$EXIT_CODE" = "0" ]; then
                echo "vault-0 is already unsealed"
              else
                # ★不可达现在是**真异常**（单副本，它就是全部），故失败退出。
                echo "vault-0 is not reachable (exit code $EXIT_CODE)" >&2
                exit 1
              fi
          volumes:
          - name: vault-tls
            secret:
              secretName: vault-internal-tls
              items:
              - key: ca.crt
                path: ca.crt
