# tag-fail CIP：aster-guard-demo-tool（闭 unresolved-tag TOCTOU）
#
# CI 推送可变 tag（<sha>），但部署只允许 cosign-verified digest；tag 形式一律在准入阶段拒绝。
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: wontlost-aster-guard-demo-tool-reject-tag
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  images:
    - glob: "index.docker.io/wontlost/aster-guard-demo-tool:**"
  authorities:
    - static:
        action: fail
        message: "受控仓 aster-guard-demo-tool 只允许 cosign-verified digest；tag 形式一律拒绝（S2-0 TOCTOU 闭合）"
  mode: enforce
