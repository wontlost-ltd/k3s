# Aster Runner 命名空间 + launcher 微服务（S2-1a-2 Slice-2b-launch）
# 由 ApplicationSet aster-lang-apps 自动发现并部署（apps/aster-lang/*/kustomization.yaml）。
# 2b-seed 只建 namespace；2b-launch 先部署脚手架 SA/Role/RoleBinding/Service。
# ★network-policy.yaml 默认注释禁用（k3s kube-router caveat），故不列入 resources——
#   待确认集群 CNI 支持 NetworkPolicy enforce 后再解注释并加入。
#
# ★★deployment.yaml + external-secrets.yaml **已解门上线**（go-live 迁移已完成）：
#   launcher 镜像真签 digest 已 pin（images 段 + image-lock）+ Vault path apps/aster-runner-launcher
#   （hmac-key）已 provision。kustomize images transformer 用真 digest 覆写 Deployment 占位 →
#   sigstore admission 过（有 cosign 签名）；ExternalSecret 从 Vault 拉 hmac-key。
#
# ★迁移专用的 runner-topology lane 已随之退休（其校验器硬编码「恰新增 deployment+external-secrets」，
#   迁移完成后永不可能再通过，只剩拦住一切合法 runner 配置变更的副作用）。现行门禁：
#     - images 段（pin 数据本体）变更 → 必须与 image-lock 同 PR 双写，否则 fail-closed；
#     - 只改 resources（注册 pdb.yaml 等清单）→ 属日常运维，走 lane=none；
#     - 无论哪种，verify-rendered-by-digest-runner.yml 对所有 runner/** PR 无条件断言 by-digest。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aster-runner
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - service.yaml
  - deployment.yaml
  - external-secrets.yaml
  - ingress.yaml
  - pdb.yaml
# ★launcher 镜像 digest（部署真相）：image-pin 脚本改写此段的 digest，k3s verify 校验 == image-lock。
#   image-pin 脚本 kcount 校验此段恰 1 条（open-image-pin-pr.sh:65-66）——故 deployment.yaml 暂不部署
#   期间**保留**本 images 条（脚本按 .images[].name 计数，不依赖 deployment 在 resources 里；kustomize
#   容忍未被引用的 images 条）。launcher 首个 CI PR 写真 digest 到此 + image-lock。
images:
  - name: docker.io/wontlost/aster-runner-launcher
    digest: sha256:b608f037dca95b329cb0d5cc5ff57b258620892bb32e9d2945e09d435c897a1b
