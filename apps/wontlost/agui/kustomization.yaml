apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
# network-policy.yaml 暂不引用，原因见该文件顶部的 rollout note。

# 镜像引用由应用仓库 (wontlost-ltd/agui-examples) 的 release-demo.yml
# 通过 `kustomize edit set image` 自动写入 immutable digest。首次 demo-v0.1.0 发布的 digest 由手工写入。
images:
- name: wontlost/agui-starter
  newName: wontlost/agui-starter
  newTag: 0.1.0
  digest: sha256:80ccb27d577a75b9b9b6257e494ac7ee9bcc9645273002ec7afd6c2314cb4b5a
