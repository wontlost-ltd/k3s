# P1-R21 (audit): HorizontalPodAutoscaler for aster-api.
#
# Why: aster-api 现在是 2 replica HA 配置, 但稳态流量可能远超 2 pod 容量,
# 或者长尾静默时浪费节点资源. HPA 在 [2, 6] 之间根据 CPU 和内存使用率
# 自动扩缩.
#
# Targets:
#   - 仅 CPU 70%（相对 requests 250m ≈ 175m 真实负载）。
#   - 不再使用内存指标：JVM 堆在负载过后基本不回缩，内存利用率长期停在 69%-74%，
#     对 80% 目标意味着「扩上去就永不缩回」——2026-10-26 压测后停在 6 副本，
#     ceil(6 × 69/80) = 6。内存保护由 Guaranteed QoS（request = limit = 512Mi）承担。
#
# Bounds:
#   - min=2: 保持 R21 HA 决策的下限
#   - max=3: 集群为 4×1 OCPU / 6GB（OCI Always Free 额度）。按本次调整后的 requests
#     （aster-api 250m ×2、Traefik 100m ×2、cloudflared 25m ×2）集群 CPU requests 约 3.7/4 核，
#     第 3 个副本只有在其他 Pod 释放余量时才能调度，否则保持 Pending（无害，等待余量）；
#     更多副本会挤压同节点上的 etcd / Traefik。节点扩容后再上调
#     （ephemeral-storage 另有 6 个 pod 的上限，见 docs/runbooks/lexicon-recovery.md）。
#
# Behavior:
#   - scaleDown.stabilizationWindowSeconds=300: 防抖, 避免 traffic spike 后立即缩容
#   - scaleUp: 每 60s 最多新增 1 个 Pod。原「60s 内翻倍、至少 +2」在压测中让 4 个 JVM
#     同时冷启动（每个约 0.4-0.5 核），1 vCPU 节点上与在服 Pod、PostgreSQL、etcd 抢 CPU，
#     吞吐反而跌到 3 RPS，并诱发 etcd 就绪失败。逐个扩容让新 Pod 预热完再接下一个。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aster-api
  namespace: aster-cloud
  labels:
    app: aster-api
    app.kubernetes.io/name: aster-api
    app.kubernetes.io/part-of: aster-lang
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aster-api
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
