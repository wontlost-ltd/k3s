# 受保护工具命名空间 aster-tools（aster-api ADR 0054 §12 D3；wontlost-ltd/aster-api#466 阶段 C）
#
# 由 ApplicationSet aster-lang-apps 自动发现，派生 Application aster-tools、目标命名空间 aster-tools。
# 上线顺序见 apps/aster-lang/guard/kustomization.yaml 头部。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aster-tools
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  # ★启用：aster-lang 下首个启用的 NetworkPolicy（namespace-only peer，原因见文件头）。
  - network-policy.yaml
  - external-secrets.yaml
  - role-probe-read.yaml
  - rolebinding-probe-read.yaml
# 镜像 digest pin（部署真相）——由 aster-guard 的 image-pin PR 与 image-lock.yaml 双写；当前为 bootstrap 全零占位。
images:
  - name: docker.io/wontlost/aster-guard-demo-tool
    digest: sha256:d6df65b7bab4c692b0bc95799be7a554171605b047e6d90917cddb085b092755
