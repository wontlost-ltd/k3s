name: Secret scan

# 防止明文凭据再次进入本仓（issue #486 复盘项）。
#
# ★为什么需要：本 public 仓的 git 历史里曾有一个**生产** PG 账户的明文密码，
#   硬编码在两个 tracked 的 setup 脚本里约 2.5 个月。工作区已移除，但历史仍可检索
#   （实测全量扫描仍报 3 处）。移除提交自身就写明「public 仓明文泄露」
#   ——即团队已知悉，却没有任何机制阻止下一次同类提交。本 workflow 补的正是这一层。
#
# ★范围声明（请不要高估它）：本检查只防**新增**明文凭据，
#   **不清洗历史**、**不确认轮换**。issue #486 的第 1 步（确认旧密码已失效）、
#   第 2 步（filter-repo 清洗 + force-push）、第 3 步（联系 GitHub 清 fork/PR 缓存）
#   都涉及真实凭据与历史重写，必须由维护者手工执行，不在 CI 范围内。
#
# ★用 `pull_request` 而非 `pull_request_target`：与本仓既有 workflow 同一约定。
#   后者以基分支权限运行且能读仓库 secret——对一个要扫 fork PR 内容的 job
#   而言那是最危险的组合。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 增量扫描需要 base commit 才能算范围，故取全量历史。
          # 但**扫描范围**由下面的 --log-opts 限定，不是全量重扫。
          fetch-depth: 0

      # ★不用 gitleaks/gitleaks-action：它对 **organization** 仓库要求付费 license
      #   （实测 CI 报 "[wontlost-ltd] is an organization. License key is required."），
      #   与仓库是否 public 无关。改为直接跑官方镜像里的二进制——同一个扫描引擎，
      #   无 license 限制。
      - name: Determine scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            echo "range=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            echo "range=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch / 首推：没有可靠的 base，退化为只扫当前工作区文件
            echo "range=" >> "$GITHUB_OUTPUT"
          fi

      # ★只扫**本次改动**，不扫全量历史。
      #   实测：全量历史扫出 3 处（正是 #486 那次泄露）；当前工作区 --no-git 扫出 0 处。
      #   若让门禁扫全量历史，它会**永久红**直到历史被清洗——一个永远红的门禁
      #   最终会被人关掉或加 continue-on-error，等于没装。
      #   故此处只防「新增」；历史清洗是 #486 的独立步骤。
      #
      # ★扫到即 exit 非 0（gitleaks 默认行为），不加 continue-on-error：
      #   静默通过的扫描器比没有扫描器更危险——它制造「已被覆盖」的错觉。
      - name: Run gitleaks (incremental)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          IMG=zricethezav/gitleaks:v8.30.1   # 钉版本：规则集变化会改变门禁行为
          if [ -n "$RANGE" ]; then
            echo "扫描范围（增量）: $RANGE"
            docker run --rm -v "$PWD":/repo:ro -w /repo "$IMG" \
              detect --source=/repo --log-opts="$RANGE" --no-banner --redact --verbose
          else
            echo "扫描范围: 当前工作区（--no-git）"
            docker run --rm -v "$PWD":/repo:ro -w /repo "$IMG" \
              detect --source=/repo --no-git --no-banner --redact --verbose
          fi
