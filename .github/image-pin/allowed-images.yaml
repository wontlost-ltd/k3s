# 受控镜像验签策略数据表（image-pin 信任根）
#
# 统一镜像 digest pin 设计 v2（A′）Phase 1 —— 见 wontlost-ltd/k3s#4、
# aster-api/.claude/analysis/unified-digest-pin-design.md（§7）、blocker1/blocker2 spike。
#
# ★ 这是**信任根**：verify-image-pin workflow 从本表取 image repo / cosign 验签身份，
#   **绝不**从 PR 内容取。本文件受 push ruleset 保护（禁 image-pin PR 修改），只走人工流程。
#
# 每个 entry 定义一个受控镜像及其**唯一合法来源仓 + workflow 身份**。verifier 对
# image-lock 里出现的每个镜像，按 `image` 精确匹配到本表 entry，再用其字段做 cosign verify。
# 表里没有的镜像出现在 image-lock → 直接拒（未知来源不放行）。

version: 1

# cosign 验签统一常量（OIDC issuer 对所有 GitHub Actions 签发的 keyless 证书一致）。
oidcIssuer: https://token.actions.githubusercontent.com

images:
  # ── aster-api 主镜像 ──────────────────────────────────────────────
  - image: docker.io/wontlost/aster-api
    sourceRepo: wontlost-ltd/aster-api         # 唯一合法源仓（org=wontlost-ltd，2026-07-30 转仓）
    workflowFile: deploy.yml                  # 唯一合法签发 workflow
    sourceRef: refs/heads/main                # 唯一合法 ref（只信 main 构建）
    deployBinding: kustomization      # 静态部署镜像：pin 落 cloud/kustomization images transformer
    # verifier 据此拼 --certificate-identity：
    #   https://github.com/{sourceRepo}/.github/workflows/{workflowFile}@{sourceRef}
    # 并加 --certificate-github-workflow-{repository,ref,sha} 约束（sha 来自 image-lock）。

  # ── aster-cloud-migrate 迁移镜像 ──────────────────────────────────
  - image: docker.io/wontlost/aster-cloud-migrate
    sourceRepo: wontlost-ltd/aster-cloud       # 不同源仓 / 不同身份（Q2：分别验签）
    workflowFile: ci.yml
    sourceRef: refs/heads/main
    deployBinding: kustomization      # 静态部署镜像：pin 落 cloud/kustomization images transformer

  # ── aster-replay-runner runner 镜像（S2-1a-2 Slice-2b）─────────────
  # runner 由 in-cluster launcher 运行时启动的临时 Job 运行，源仓同 aster-api
  # 但独立 workflow（aster-replay-runner-deploy.yml）签发。verify-cip-sync 的
  # 2N 契约要求本条与两 runner CIP 同在（3 仓 → 6 CIP）。
  - image: docker.io/wontlost/aster-replay-runner
    sourceRepo: wontlost-ltd/aster-api         # 唯一合法源仓（org=wontlost-ltd，2026-07-30 转仓）
    workflowFile: aster-replay-runner-deploy.yml
    sourceRef: refs/heads/main
    deployBinding: env                # ★env-bound：runner 由 launcher 运行时经 Deployment env RUNNER_IMAGE_DIGEST 注入，pin 落该 env value（非 kustomization）

  # ── aster-runner-launcher 镜像（S2-1a-2 Slice-2b-launch）─────────────
  # in-cluster runner-launcher 微服务镜像，源仓同 aster-api 但独立 workflow
  # （aster-runner-launcher-deploy.yml）签发。★verify-cip-sync 的 2N 契约因本条从
  # 3 仓/6 CIP 升为 4 仓/8 CIP——须与两 launcher CIP 原子同落。
  - image: docker.io/wontlost/aster-runner-launcher
    sourceRepo: wontlost-ltd/aster-api         # 唯一合法源仓（org=wontlost-ltd，2026-07-30 转仓）
    workflowFile: aster-runner-launcher-deploy.yml
    sourceRef: refs/heads/main
    deployBinding: kustomization      # 静态部署镜像：launcher 在 runner/kustomization images transformer

  # ── aster-lsp 镜像（aster-deploy#9）─────────────────────────────────
  # lsp 此前**完全没有 CI 也没签过名**，只靠本地 task deploy:lsp 推可变 tag 0.0.9。
  # 签名 CI 见 aster-cloud ci.yml 的 build-lsp-image job（Dockerfile.lsp 在该仓）。
  #
  # 现状：lsp 已由 ArgoCD 管理（#512 补了 apps/aster-lang/lsp/kustomization.yaml，
  #   appset 的 `apps/aster-lang/*/kustomization.yaml` glob 遂能发现它）。
  #
  # ⚠️ 现状：lsp 的 digest 仍是**手工 pin**——本目录下无 lsp 的 image-lock entry，
  #   aster-cloud ci.yml 也明写「本次不开 image-pin PR」，故没有自动更新链路。
  #
  #   ★但「静默停留在旧镜像」这条**复发路径已被堵住**：
  #     scripts/image-pin/verify-no-floating-tags.sh 在每个 PR 上断言
  #     每个应用渲染出的镜像都带 @sha256，且**自动发现**新应用（无需接线）。
  #     再退回可变 tag 会立刻红（已用还原本次事故的变异实测）。
  #
  #   剩余缺口是「digest 会过时」而非「digest 不存在」——过时的 digest 仍是
  #   可审计的确定值，与当初 tag 冻结七个月且无人知晓有本质区别。
  #   接 image-pin 自动化仍值得做（见 wontlost-ltd/k3s#491/#500），
  #   但需改 verify-image-pin.yml 的逐路径 env（CLOUD_LOCK_PATH 等非 glob），
  #   属对该安全门禁的结构性改动，单独立项。
  - image: docker.io/wontlost/aster-lsp
    sourceRepo: wontlost-ltd/aster-cloud       # Dockerfile.lsp 与签名 job 都在 aster-cloud
    workflowFile: ci.yml
    sourceRef: refs/heads/main
    deployBinding: kustomization      # 接管后 pin 落 lsp/kustomization images transformer
