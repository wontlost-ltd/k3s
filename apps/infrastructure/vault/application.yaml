apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    # Deploy after vault-config (TLS certs must be ready)
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: secrets-management
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.31.0
    helm:
      releaseName: vault
      values: |
        global:
          enabled: true
          tlsDisable: false

        injector:
          enabled: true
          replicas: 1
          image:
            pullPolicy: IfNotPresent
          podDisruptionBudget: {}
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 150m
          # Security hardening
          securityContext:
            pod:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            container:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        server:
          enabled: true
          image:
            repository: hashicorp/vault
            tag: "1.19.0"
            pullPolicy: IfNotPresent

          # Security hardening
          # NOTE: Vault has specific security requirements that differ from typical apps:
          # - readOnlyRootFilesystem: false - Vault writes to /vault/data (Raft) and /tmp
          #   Data storage is on a separate PVC, but rootfs write is needed for runtime
          # - IPC_LOCK capability - Required for mlock() to prevent secrets from being
          #   swapped to disk. Removing this would degrade security, not improve it.
          # See: https://developer.hashicorp.com/vault/docs/configuration#disable_mlock
          statefulSet:
            securityContext:
              pod:
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              container:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - IPC_LOCK

          # 资源缩减：单副本模式
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 400m

          # Development mode (for testing - uses in-memory storage)
          dev:
            enabled: false

          # 单副本模式：禁用 standalone，使用 HA+Raft（单节点）
          standalone:
            enabled: false

          # 单副本：移除 anti-affinity
          affinity: ""

          # HA mode with Raft storage（单副本）
          ha:
            enabled: true
            replicas: 1
            disruptionBudget:
              maxUnavailable: null
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file = "/vault/tls/tls.crt"
                  tls_key_file = "/vault/tls/tls.key"
                  telemetry {
                    unauthenticated_metrics_access = false
                  }
                }

                storage "raft" {
                  path = "/vault/data"
                  retry_join {
                    leader_api_addr = "https://vault-0.vault-internal:8200"
                    leader_ca_cert_file = "/vault/tls/tls.crt"
                    leader_client_cert_file = "/vault/tls/tls.crt"
                    leader_client_key_file = "/vault/tls/tls.key"
                  }
                }

                # ══ OCI KMS auto-unseal（k3s#488）══════════════════════════
                #
                # ⚠️ **默认注释掉**：启用它 = 从 shamir 迁到 KMS,是一次性、
                #   不可逆的迁移仪式(见 docs/488-migration-runbook.md)。
                #   合并本 PR 只把配置就位,**不触发迁移** —— pod 即便因其他
                #   原因重启,注释态的 seal 不生效,Vault 仍走 shamir,不会
                #   因 KMS 权限未通而起不来。
                #
                # 迁移窗口执行时:
                #   1) 取消下面整段注释,提交并让 ArgoCD 同步
                #   2) kubectl -n vault rollout restart statefulset vault
                #   3) vault operator unseal -migrate ×3(输 3 把 shamir key)
                #   4) 删 pod 验证自动解封 → 成功后 rekey + 删 auto-unseal Secret
                #
                # 前置(已核实):KMS key 已建、policy vault-unseal-kms 两条语句
                #   填真实 key OCID、dynamic-group vault-unseal-instances 的
                #   matching-rule 匹配 compartment 所有实例。
                #
                # auth_type_api_key 用字符串 "false" —— 走 master 节点的
                #   instance principal(dynamic-group 匹配的身份),不落 API key。
                #
                # seal "ocikms" {
                #   crypto_endpoint     = "https://f5vlukbcaaclq-crypto.kms.ap-melbourne-1.oraclecloud.com"
                #   management_endpoint = "https://f5vlukbcaaclq-management.kms.ap-melbourne-1.oraclecloud.com"
                #   key_id              = "ocid1.key.oc1.ap-melbourne-1.f5vlukbcaaclq.abwwkljrpdxjzlyideb675qx3nfs5h34sss4tcsejpw4uudt7koezd4qwgeq"
                #   auth_type_api_key   = "false"
                # }
                # ═══════════════════════════════════════════════════════════

                service_registration "kubernetes" {}

                telemetry {
                  prometheus_retention_time = "30s"
                  disable_hostname = true
                }

          # Mount TLS certificate from cert-manager
          volumes:
            - name: vault-tls-internal
              secret:
                secretName: vault-internal-tls

          volumeMounts:
            - name: vault-tls-internal
              mountPath: /vault/tls
              readOnly: true

          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: null

          auditStorage:
            enabled: true
            size: 5Gi
            storageClass: null

          # External ingress disabled - using IngressRoute instead
          # (ServersTransport annotation doesn't work reliably with Kubernetes Ingress)
          ingress:
            enabled: false

        ui:
          enabled: true
          serviceType: ClusterIP

        # Prometheus metrics
        # NOTE: ServiceMonitor disabled until monitoring stack is deployed
        # After monitoring is ready, set enabled: true and sync Vault again
        serverTelemetry:
          serviceMonitor:
            enabled: false
            # Re-enable after monitoring deployment:
            # enabled: true
            # selectors:
            #   release: prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
