# ExternalSecrets for PostgreSQL Cluster Credentials
---
# Superuser credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-superuser-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: data-services/postgres
        property: superuser_username
    - secretKey: password
      remoteRef:
        key: data-services/postgres
        property: superuser_password

---
# ★★ 迁移须知（type 不可变）★★
#
# Kubernetes 的 Secret `.type` 是**不可变字段**（实测 patch 报 `field is immutable`）。
# 因此把既有 Opaque Secret 改成 kubernetes.io/basic-auth 时，ExternalSecrets Operator
# **无法原地更新**——必须先删掉旧 Secret，让 ESO 按新模板重建：
#
#   kubectl delete secret -n data-services \
#     aster-api-postgres-credentials authentik-postgres-credentials grafana-postgres-credentials
#   # ESO 会在数秒内按新 template 重建（creationPolicy: Owner）
#
# 删除期间的影响：这些 Secret 只被 CNPG 读取以 reconcile 角色密码，
# 不被应用 Pod 直接挂载（应用读的是各自 namespace 的副本），故删除→重建的
# 数秒空窗**不影响线上**。重建后确认：
#   kubectl get secret -n data-services aster-api-postgres-credentials -o jsonpath='{.type}'
#   kubectl get cluster -n data-services shared-postgres -o jsonpath='{.status.managedRolesStatus}'

# Authentik database credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # ★CNPG managed role 的硬性要求（官方文档）：
    #   1) Secret 必须是 kubernetes.io/basic-auth 类型，否则 operator **完全不 reconcile**
    #      ——表现为 status.managedRolesStatus 恒为空、改密码不触发 ALTER ROLE、且无任何报错。
    #   2) 必须带 cnpg.io/reload: "true"，否则密码变更只在下次缓存刷新时才生效。
    #   3) username 必须与 role 名一致。
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      # username 必须等于 role 名。Vault 该路径下只存 password，
      # 故用 template 常量注入（角色名是固定的，不属于机密）。
      data:
        username: authentik_user
  data:
    - secretKey: password
      remoteRef:
        key: data-services/authentik-db
        property: password

