# LSP 网关的会话 ticket 验签密钥 —— 从 Vault 下发（issue #500、aster-cloud#657 / #728）。
#
# ★网关只接受 cloud 签发的 60 秒一次性 ticket（deployment.yaml 的 LSP_TICKET_REQUIRED=true）。
#   原静态共享 token（LSP_AUTH_TOKEN / NEXT_PUBLIC_LSP_TOKEN）已下线，不再下发。
#   Vault 里遗留的 apps/aster-lsp 的 `token` 属性已无人使用，可择机删除。
#
# ★缺 ticket_secret 的后果：Deployment 的 secretKeyRef 非 optional，新 pod 会卡在
#   CreateContainerConfigError、滚动更新停住（旧 pod 继续服务）。
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-lsp-auth
  namespace: aster-lsp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-lsp-auth
    creationPolicy: Owner
  data:
    # 短时会话 ticket 的 HMAC 密钥（aster-cloud#657 / #728）：cloud Worker 用同一值签发
    # 60 秒一次性 ticket，网关验签。它只在服务端，不进前端产物。
    # 前置：vault kv patch secret/apps/aster-lsp ticket_secret=<openssl rand -hex 32>
    #（用 patch，put 会覆盖该路径下的其他属性）；同一值 `wrangler secret put LSP_TICKET_SECRET` 写入 cloud Worker。
    - secretKey: LSP_TICKET_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-lsp
        property: ticket_secret
