# Secrets Management Project
# Manages Vault and External Secrets Operator
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secrets-management
  namespace: argocd
spec:
  description: "Secrets management - Vault and External Secrets Operator"
  sourceRepos:
    - 'https://github.com/wontlost-ltd/k3s.git'
    - 'https://helm.releases.hashicorp.com'
    - 'https://charts.external-secrets.io'
  destinations:
    # Core secrets infrastructure namespaces ONLY
    # These namespaces require full workload management (Vault, ESO deployments)
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    # ArgoCD namespace for app-of-apps pattern
    - namespace: argocd
      server: https://kubernetes.default.svc
  # Cluster-scoped resources - minimal set for secrets infrastructure
  clusterResourceWhitelist:
    # Namespace creation (for CreateNamespace=true)
    - group: ''
      kind: Namespace
    # External Secrets cluster-scoped resources
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: external-secrets.io
      kind: ClusterExternalSecret
    # Webhook configurations (required by ESO and Vault)
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    # CRDs (required for Helm chart installations)
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    # ClusterRoles for Vault/ESO service accounts (required by Helm charts)
    # Risk mitigated by restricting destinations to vault/external-secrets only
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  # Namespaced resource allowlist for vault and external-secrets namespaces
  # Since destinations are now restricted to only these two namespaces,
  # full workload management here is acceptable and required for Helm charts
  namespaceResourceWhitelist:
    # Core workloads (required for Vault/ESO Helm deployments)
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    # Networking (for vault/external-secrets only)
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    # Traefik CRDs (for Vault HTTPS backend with ServersTransport)
    - group: traefik.io
      kind: IngressRoute
    - group: traefik.io
      kind: ServersTransport
    # RBAC (for vault/external-secrets only)
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    # Monitoring
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    # ★PrometheusRule：本项目此前只放行 ServiceMonitor/PodMonitor（能采集、
    #   但**不能告警**）。aster-lang / data-services / infrastructure 三个项目
    #   都放行了它，唯独本项目没有 —— 属白名单遗漏而非有意收紧。
    #
    #   实证：vault 的解封失败告警（apps/infrastructure/vault/unseal-alerts.yaml）
    #   因此同步失败，报 "resource monitoring.coreos.com:PrometheusRule is not
    #   permitted in project secrets-management"，重试 5 次后 Application 卡 OutOfSync。
    #
    #   ★这类失败 `kubectl apply --dry-run=server` **查不出来** ——
    #     它校验的是 API server 是否接受该对象，而项目白名单是 ArgoCD 自己的
    #     准入层，只在真正 sync 时才生效。改动涉及新 kind 时须实际同步一次才算验过。
    - group: monitoring.coreos.com
      kind: PrometheusRule
    # External Secrets - the main purpose of this project
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    # cert-manager namespaced resources (for Vault TLS only)
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer
    # Policy
    - group: policy
      kind: PodDisruptionBudget
    # ArgoCD Application for app-of-apps pattern
    - group: argoproj.io
      kind: Application
