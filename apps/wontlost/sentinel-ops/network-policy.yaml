# Sentinel Ops NetworkPolicy
#
# IMPORTANT (rollout note)：本文件存在于 git 但 kustomization.yaml 暂未引用，
# 即 ArgoCD 不会立即 apply。沿用 ckeditor-builder 的同一约定——2026-05-29
# cloudflare-tunnel 的同类型策略触发过生产 502（k3s/commit/4b64fb5），此后
# 每条 NetworkPolicy 改动都要求配套 post-deploy-smoke 覆盖。待 sentinel-ops
# 的 smoke 端点加入 scripts/post-deploy-smoke.sh 后，再把本文件加入
# kustomization.yaml 的 resources 列表。
#
# 本应用的网络面比 ckeditor-builder 简单得多：无数据库、无外部 API 调用，
# 出站实际上只需要 DNS。
#
# 入站来源是 **cloudflared（cloudflare namespace）而不是 Traefik**：本站的
# Cloudflare Tunnel public hostname 直接指向
#   http://sentinel-ops.wontlost-sentinel-ops.svc.cluster.local:80
# 流量不经过 Traefik。最初照搬 ckeditor-builder 时把入站写成了只允许
# kube-system，那样一旦启用会立刻 502——ckeditor-builder 的 tunnel 同样是
# 直连 Service，它那条 kube-system 规则实际也没有被这条路径用到。
# Ingress 对象仍然保留：集群内其他消费者或将来切回 Traefik 时用得上，
# 故 kube-system 也一并放行。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: wontlost-sentinel-ops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-ops-ingress
  namespace: wontlost-sentinel-ops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app: sentinel-ops
  policyTypes:
    - Ingress
  ingress:
    # cloudflared (cloudflare namespace) → :8090
    # 这是生产流量的实际入口：tunnel 直连 Service，不经 Traefik。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
      ports:
        - protocol: TCP
          port: 8090
    # Traefik (kube-system) → :8090
    # Ingress 对象仍在，保留这条以便集群内经 Traefik 访问，
    # 以及将来若把 tunnel 指回 Traefik 时不必再改策略。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8090
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-ops-egress
  namespace: wontlost-sentinel-ops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app: sentinel-ops
  policyTypes:
    - Egress
  egress:
    # DNS —— 这是本应用唯一的出站需求。演示数据全在内存，
    # 不连数据库、不调外部 API，因此这里没有 443 规则。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
