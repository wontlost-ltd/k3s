---
# Aster API database credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-api-postgres-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-api-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # ★CNPG managed role 的硬性要求（官方文档）：
    #   1) Secret 必须是 kubernetes.io/basic-auth 类型，否则 operator **完全不 reconcile**
    #      ——表现为 status.managedRolesStatus 恒为空、改密码不触发 ALTER ROLE、且无任何报错。
    #   2) 必须带 cnpg.io/reload: "true"，否则密码变更只在下次缓存刷新时才生效。
    #   3) username 必须与 role 名一致。
    template:
      type: kubernetes.io/basic-auth
      # ★必须 Merge：默认 mergePolicy 是 Replace，template.data 会**整个替换**
      #   从 provider 取到的键，导致 Secret 里只剩 username、password 丢失
      #   （ESO 仍报 SecretSynced，静默无错）。
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      # ★username 用常量注入，不从 Vault 取：实测 Vault 的
      #   secret/data-services/aster-api-db **只有 password 字段**，
      #   原先引用 property: username 会让整个 ExternalSecret 同步失败
      #   （cannot find secret data for key: "username"）——Secret 被删后就再也建不回来。
      #   角色名是固定值、不属机密，与 authentik/grafana 保持一致做法。
      data:
        username: aster_api_user
  data:
    - secretKey: password
      remoteRef:
        key: data-services/aster-api-db
        property: password

---
# Aster 迁移专用角色凭据（2026-08-17 安全审计：owner 分离）
#
# aster_migrator 持有 aster_api 各表的 owner 并跑 Flyway；aster_api_user 降为纯运行时。
# 分离的理由见 cluster.yaml 中该 role 的注释（表 owner 可自解 append-only 保护）。
#
# ★前置：Vault 路径 secret/data-services/aster-migrator-db 必须先有 password 字段，
#   否则本 ExternalSecret 同步失败 → Secret 不存在 → CNPG 不创建角色 →
#   应用启动时 Flyway 用不存在的角色连库而失败。
#   写入方式见 apps/infrastructure/secret-rotation/README.md（Vault KV-v2 是**整体替换**，
#   只 POST {password} 会抹掉同路径其他键）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-migrator-postgres-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-migrator-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # CNPG managed role 的四项硬性要求，与 aster-api-postgres-credentials 完全一致：
    #   1) type 必须 kubernetes.io/basic-auth，否则 operator 完全不 reconcile（静默）
    #   2) 必须带 cnpg.io/reload: "true"
    #   3) username 必须与 role 名一致
    #   4) mergePolicy 必须 Merge，否则 template.data 整体替换掉 provider 的 password
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: aster_migrator
  data:
    - secretKey: password
      remoteRef:
        key: data-services/aster-migrator-db
        property: password

---
# Backup credentials (S3)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: data-services/postgres-backup
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: data-services/postgres-backup
        property: secret_access_key
