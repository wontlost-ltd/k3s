# aster-guard-mcp（ADR 0054 §3.1、§12 D4）：无状态 Streamable HTTP 监听模式，上游为 aster-tools 的演示工具。
# --isolation network,auth：工具入站策略只放行本命名空间（network），转发时附 consume 票据、工具侧核对（auth）。
# 每个 Agent 以 --agents-file 登记的 principal 裁决；代理的 Guard key 与工具的 key 不同（ADR 0054 §3.3）。
# replicas: 1（U-K4）：前置为 Vault（U-K2）、信任根（PR 7a）与首个 pin 已落地。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aster-guard-mcp
  labels:
    app: aster-guard-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: aster-guard-mcp
  template:
    metadata:
      labels:
        app: aster-guard-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aster-guard-mcp
          image: docker.io/wontlost/aster-guard-mcp
          imagePullPolicy: IfNotPresent
          args:
            - --listen
            - 0.0.0.0:8080
            - --upstream-url
            - http://demo-tool.aster-tools.svc.cluster.local:8080/mcp
            - --isolation
            - network,auth
            - --base-url
            - http://aster-api.aster-cloud.svc.cluster.local
            - --policy
            - guard.demo/decide
            - --tenant-id
            - $(ASTER_GUARD_TENANT_ID)
            - --tools
            - demo_echo,demo_delete
            - --agents-file
            - /etc/aster-guard/agents.json
            - --executor-id
            - aster-guard-mcp@$(POD_NAME)
          ports:
            - name: http
              containerPort: 8080
          env:
            # API key 只从环境变量读取（argv 对同机进程可见），且不会发给上游工具。
            - name: ASTER_GUARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aster-guard-mcp
                  key: proxy-api-key
            - name: ASTER_GUARD_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: aster-guard-mcp
                  key: tenant-id
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # /readyz：最近 30 s 内上游 tools/list 成功过（工具不可用时摘流）；/healthz：进程存活。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: agents
              mountPath: /etc/aster-guard
              readOnly: true
      volumes:
        - name: agents
          secret:
            secretName: aster-guard-mcp
            items:
              - key: agents-json
                path: agents.json
