# 部署层探针身份（aster-api ADR 0054 §12 D9）。凭证只以 TokenRequest 签发的绑定 token 经 kubeconfig 使用
# （k3s Environment guard-probe 的 GUARD_PROBE_KUBECONFIG，scripts/guard-bypass/kubeconfig-for-probe.sh 生成），
# 不挂进任何 Pod。吊销：删除本 SA（Argo 重建同名 SA，新 UID 不接受旧 token）。权限见三个命名空间的 Role。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guard-bypass-probe
automountServiceAccountToken: false
