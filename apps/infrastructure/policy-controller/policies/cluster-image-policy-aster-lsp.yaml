# digest-verify CIP：aster-lsp（aster-deploy#9）
# 信任根：sourceRepo wontlost-ltd/aster-cloud, workflowFile ci.yml,
#   sourceRef refs/heads/main（对齐 aster-cloud ci.yml build-lsp-image job 的 cosign identity-regexp）。
#
# 现状：aster-lsp namespace 已 opt-in（namespace.yaml 打了
#   policy.sigstore.dev/include: "true"），本 CIP 对该命名空间的工作负载**已生效**。
#
# ★这里曾长期是「已定义但从未生效」的状态：CIP 是 enforce、glob 也匹配，
#   唯独命名空间没打标签，webhook 的 namespaceSelector 便直接跳过——
#   看起来样样就绪，实际一次都没跑过。真实后果是一个 tag pin（而非 digest）
#   的 Pod 畅通无阻地起来了，且那个镜像旧到没有 token 门。
#   判据：**撤掉标签后用旧 tag 跑 `--dry-run=server`，若能通过，就说明门是死的。**
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: wontlost-aster-lsp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  images:
    - glob: "index.docker.io/wontlost/aster-lsp@sha256:**"
  authorities:
    - keyless:
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/wontlost-ltd/aster-cloud/.github/workflows/ci.yml@refs/heads/main
  mode: enforce
