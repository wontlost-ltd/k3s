# 演示工具的 Guard 凭据：Vault secret/apps/aster-guard-demo（用户一次写全，见 U-K2）。
# tool-api-key 是**工具自己的**同租户 MEMBER key，与代理的 proxy-api-key 不同（ADR 0054 §3.3）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-tool-guard
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-tool-guard
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: tool-api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-guard-demo
        property: tool-api-key
    - secretKey: tenant-id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-guard-demo
        property: tenant-id
