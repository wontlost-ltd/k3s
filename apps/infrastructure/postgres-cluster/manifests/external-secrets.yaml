---
# Aster API database credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-api-postgres-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-api-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # ★CNPG managed role 的硬性要求（官方文档）：
    #   1) Secret 必须是 kubernetes.io/basic-auth 类型，否则 operator **完全不 reconcile**
    #      ——表现为 status.managedRolesStatus 恒为空、改密码不触发 ALTER ROLE、且无任何报错。
    #   2) 必须带 cnpg.io/reload: "true"，否则密码变更只在下次缓存刷新时才生效。
    #   3) username 必须与 role 名一致。
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      # ★username 用常量注入，不从 Vault 取：实测 Vault 的
      #   secret/data-services/aster-api-db **只有 password 字段**，
      #   原先引用 property: username 会让整个 ExternalSecret 同步失败
      #   （cannot find secret data for key: "username"）——Secret 被删后就再也建不回来。
      #   角色名是固定值、不属机密，与 authentik/grafana 保持一致做法。
      data:
        username: aster_api_user
  data:
    - secretKey: password
      remoteRef:
        key: data-services/aster-api-db
        property: password

---
# Backup credentials (S3)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-credentials
  namespace: data-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: data-services/postgres-backup
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: data-services/postgres-backup
        property: secret_access_key
