# 金丝雀 Agent token（明文；代理侧只登记其 sha256）：探针 cross Pod 以它经代理调用 demo_echo / demo_delete，
# 证明「直连被挡」不是因为链路坏了。★这是本命名空间唯一允许存在的 Secret（名称 guard-demo-agent、类型 Opaque），
# 新增 Agent 凭证须同时改准入白名单并重新评审计划 §3。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guard-demo-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: guard-demo-agent
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-guard-demo
        property: agent-token
