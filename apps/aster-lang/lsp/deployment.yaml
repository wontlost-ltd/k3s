# Aster LSP WebSocket Server Deployment
# Language Server Protocol proxy for Monaco editor integration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aster-lsp
  namespace: aster-lsp
  labels:
    app: aster-lsp
    app.kubernetes.io/name: aster-lsp
    app.kubernetes.io/part-of: aster-lang
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aster-lsp
  template:
    metadata:
      labels:
        app: aster-lsp
        app.kubernetes.io/name: aster-lsp
    spec:
      automountServiceAccountToken: false
      # R30+ audit P1：显式 grace period，让 in-flight LSP 请求在 SIGTERM 后
      # 有时间走完，避免 client（IDE）看到"半个补全"的截断响应。
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aster-lsp
          image: docker.io/wontlost/aster-lsp:0.0.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            # Server configuration
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            # CORS - allowed origins for WebSocket connections
            # ★ No localhost here. This manifest is production-only (flat dir, no
            #   dev overlay), so an http://localhost:3000 entry never serves local
            #   development — it only means any page a visitor happens to be running
            #   on their own port 3000 counts as an allowlisted origin against the
            #   production LSP WebSocket. Local dev should point at a local LSP, or
            #   carry this override in a dev-only overlay.
            - name: ALLOWED_ORIGINS
              value: "https://aster-lang.cloud,https://www.aster-lang.cloud"
            # ★共享 token —— 缺它则生产环境**全部连接被拒**（401
            #   "Token gate not configured"，见 lsp-server.mjs 的 evaluateUpgrade
            #   第 4 步；Dockerfile.lsp 已设 NODE_ENV=production）。
            #   由 external-secrets.yaml 从 Vault 下发。
            - name: LSP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aster-lsp-auth
                  key: LSP_AUTH_TOKEN
            # Node.js tuning
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
      volumes:
        - name: tmp
          emptyDir: {}
