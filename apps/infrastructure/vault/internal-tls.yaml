# Internal TLS Certificate for Vault
# Uses a self-signed CA for cluster-internal communication
# This ensures all traffic to Vault (including from ESO) is encrypted

---
# Self-signed Issuer for Vault internal CA
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned-issuer
  namespace: vault
spec:
  selfSigned: {}

---
# Vault Internal CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-ca
  namespace: vault
spec:
  isCA: true
  commonName: vault-internal-ca
  secretName: vault-internal-ca
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
  # ★把 CA **复制**到 secret-rotation ns（issue #487 第一项）。
  #
  #   起因：rotate-pg-password.sh 对 Vault 的 5 处 curl 都带 -k（跳过 TLS 校验），
  #   于是新旧 PG 密码与 Cloudflare API token 都在不验证对端身份的连接上收发。
  #   要换成 --cacert 就得让该 ns 拿到这份 CA，而 Secret 不跨 namespace 挂载。
  #
  #   用 Reflector —— 本仓**已部署**（apps/infrastructure/reflector，chart 9.1.45）
  #   且已用同一机制把通配 TLS secret 复制到 argocd/vault/authentik
  #   （见 cert-manager/wildcard-certificates.yaml 的 secretTemplate）。
  #   沿用既有组件与既有写法，零新增依赖。
  #
  #   ★allowed-namespaces 只列 secret-rotation，不用通配——CA 私钥也在这个
  #   Secret 里（isCA: true 的 Certificate 会同时产出 tls.key），
  #   多复制一个 ns 就多一处私钥暴露面。
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "secret-rotation"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"

---
# CA Issuer using the internal CA
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-internal-ca-issuer
  namespace: vault
spec:
  ca:
    secretName: vault-internal-ca

---
# Vault Server TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-tls
  namespace: vault
spec:
  secretName: vault-internal-tls
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  subject:
    organizations:
      - wontlost-ltd
  commonName: vault.vault.svc.cluster.local
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
    - digital signature
    - key encipherment
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-internal
    - "*.vault-internal"
    - "*.vault-internal.vault.svc.cluster.local"
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: vault-internal-ca-issuer
    kind: Issuer
    group: cert-manager.io
