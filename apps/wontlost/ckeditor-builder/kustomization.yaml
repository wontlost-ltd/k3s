apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- pvc.yaml
- external-secrets.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

# 镜像引用由应用仓库 (wontlost-ltd/vaadin-ckeditor-builder) 的 release.yml
# 通过 `kustomize edit set image` 自动写入 immutable digest。
# 初始值仅作占位，避免 ArgoCD 在首次 sync 时找不到 image 字段。
images:
- digest: sha256:c2f9c932c9e4d9b26c031f20649c53aeb39199756c899bd21dbb17a8ea6bafb6
  name: wontlost/ckeditor-builder
  newName: wontlost/ckeditor-builder
  newTag: main
