apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guard-bypass-probe-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guard-bypass-probe-read
subjects:
  # 探针 SA 在 aster-guard；它的凭证只经 kubeconfig 使用（Environment guard-probe），不挂进任何 Pod。
  - kind: ServiceAccount
    name: guard-bypass-probe
    namespace: aster-guard
  # 同一探针的 GitHub OIDC 身份（aster-api ADR 0057 D8）：权限与 SA 完全相同；准入策略 guard-probe-pod-scope
  # 对两个身份同等生效。apiserver 未加 --authentication-config 时该用户名无法认证，本条不扩大任何权限。
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: github-actions:wontlost-ltd/k3s:guard-probe
