# LLM 出口网关的密钥 —— 从 Vault 拉取（与本仓库其余应用一致）
#
# 两个密钥都在 Vault 路径 wontlost/llm-gateway 下：
#   - upstream_api_key  上游供应商（runanytime）的 API Key
#   - gateway_token     Worker 与网关之间的共享密钥（校验 X-Gateway-Token）
#
# ⚠️ 密钥值只进 Vault，绝不进 Git。本文件只声明「从哪里拉、映射成哪个
# 环境变量」。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-secrets
  namespace: wontlost-llm-gateway
  labels:
    app: llm-gateway
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: wontlost
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-gateway-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # 上游供应商 API Key —— 渲染进 nginx 的 Authorization: Bearer
    - secretKey: RUNANYTIME_KEY
      remoteRef:
        key: wontlost/llm-gateway
        property: upstream_api_key
    # 网关共享密钥 —— 校验 Worker 带来的 X-Gateway-Token
    - secretKey: GATEWAY_TOKEN
      remoteRef:
        key: wontlost/llm-gateway
        property: gateway_token
