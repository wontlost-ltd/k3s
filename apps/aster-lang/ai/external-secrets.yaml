# ExternalSecrets for aster-ai namespace —— 从 Vault 下发 AI 工作台的凭据
#
# 前置：本清单只负责下发，不负责创建。部署前须先在 Vault（KV-v2，挂载点 secret/）写入：
#
#   vault kv put secret/data-services/aster-ai-db \
#     username=aster_ai_user \
#     password="$(openssl rand -base64 32)"
#
#   vault kv put secret/apps/aster-ai-workspace \
#     hmac-key="<与 aster-cloud AI_WORKSPACE_HMAC_KEY 相同的值>" \
#     handoff-public-key="<base64 X.509 DER，与 cloud AI_WORKSPACE_HANDOFF_PRIVATE_KEY 成对>" \
#     ticket-key="$(openssl rand -base64 32)" \
#     pro-license="<AG-UI Pro license key；暂无时写空串>"
#
# ★KV-v2 的 put 是整体替换：只写部分键会抹掉同路径其他键，务必一次写全。
# ★四个 property 都必须存在（哪怕值为空串）：ESO 取不到任一 property 时整个
#   ExternalSecret 同步失败、Secret 不会被创建，pod 将卡在 CreateContainerConfigError。
#
# data-services/aster-ai-db 同时被 data-services 命名空间里的 CNPG 角色密码 Secret
# （apps/infrastructure/postgres-cluster/manifests/external-secrets.yaml 的
# aster-ai-postgres-credentials）读取：CNPG 用它设置角色密码，本命名空间用它连库，
# 两边同源，密码轮换只需改 Vault 一处（reloader 负责重启本 Deployment）。
---
# PostgreSQL 凭据（aster_ai_user，库 aster_cloud / schema ai_workspace）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-ai-db-credentials
  namespace: aster-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-ai-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: data-services/aster-ai-db
        property: username
    - secretKey: password
      remoteRef:
        key: data-services/aster-ai-db
        property: password

---
# 应用密钥：cloud 互信（HMAC、交接公钥）、run 票据密钥、Pro license
# Secret 的 key 名即容器 env 名（与 agui-pro 的 AGUI_PRO_LICENSE 同约定），便于对照。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-ai-app-secrets
  namespace: aster-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-ai-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AIW_HMAC_KEY
      remoteRef:
        key: apps/aster-ai-workspace
        property: hmac-key
    - secretKey: AIW_HANDOFF_PUBLIC_KEY
      remoteRef:
        key: apps/aster-ai-workspace
        property: handoff-public-key
    - secretKey: AIW_TICKET_KEY
      remoteRef:
        key: apps/aster-ai-workspace
        property: ticket-key
    - secretKey: AGUI_PRO_LICENSE
      remoteRef:
        key: apps/aster-ai-workspace
        property: pro-license
