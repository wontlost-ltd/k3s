# 代理的 Guard 凭据与 Agent 登记：Vault secret/apps/aster-guard-demo（用户一次写全，见 U-K2）。
# agents-json 只含 token 的 sha256（{"agents":[{"id":"guard-probe-canary","tokenSha256":"…"}]}），明文 token 只在 aster-agents。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-guard-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-guard-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: proxy-api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-guard-demo
        property: proxy-api-key
    - secretKey: tenant-id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-guard-demo
        property: tenant-id
    - secretKey: agents-json
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-guard-demo
        property: agents-json
