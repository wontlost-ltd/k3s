# verify-image-pin —— image-lock PR 验签闸门（统一 digest pin 设计 A′ Phase 1）
#
# 见 wontlost-ltd/k3s#4、blocker1/blocker2 spike、Codex 对抗式审查修正。
# ★ 本 workflow **只提供** required check + 纵深校验；真正的合并强制在 k3s ruleset。
# ★ 用 `pull_request`（**绝不** pull_request_target），只读 PR 数据，**不 checkout/运行 PR 代码**。
#
# ★ Codex 审查修正（Critical 1/4）：**不加 `paths` 过滤**。因为 `verify-image-pin` 是 main
#   全局 required check，若只在 image-lock 变更时触发，则改别的文件的人工 PR 永远产生不了该
#   check → 死锁。故本 workflow 对**所有** PR 运行：
#     - 未改 image-lock/kustomization/deployment 受控路径 → 发 verify-image-pin success(no-op)，
#       人工 PR 正常走其它 review 规则。
#     - 改了受控路径但 base 侧验签脚本缺失 → fail-closed（Task A4 Blocker 3；不再 no-op）。
#     - 只改 image-lock  → 严格 shape + cosign + freshness，仅验证变更 entry(base vs head)。
#     - image-lock + 其它 → shape 检查拒 → 发 failure check。

name: verify-image-pin

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read          # 读本仓 allowed-images（base 可信侧）
  pull-requests: read      # 读 PR 元数据（fork/author/head-ref/changed files）

concurrency:
  group: verify-image-pin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # ★应用路径不再逐个硬编码 —— 改由 .github/image-pin/apps.yaml 注册表派生（#500）。
  #
  #   旧写法（CLOUD_LOCK_PATH / RUNNER_LOCK_PATH / ...）的问题不是"难看"，
  #   而是**新应用不逐个接线就完全脱管，且漏接线本身无人报警**。
  #   aster-lsp 正是这样脱管七个月：其 pin 停在一个手工 tag，缺 token 门，
  #   造成公网未授权访问（#519）。现在接入一个应用 = 注册表加一条数据。
  #
  #   ★注册表**必须**从可信 base 侧读（本 workflow 只 checkout base，不执行 head 代码）——
  #     否则 PR 可以自带一份注册表把自己的路径声明成受信路径。
  APPS_REGISTRY: .github/image-pin/apps.yaml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 可信侧：checkout PR base 的代码（本仓受控脚本 + allowed-images 白名单）。
      # PR head 的 image-lock 仅作**数据**取用（见下），不 checkout head、不跑其脚本。
      - name: Checkout base (trusted side)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # ★接通 verify-cip-sync.sh（2026-07-30 审计）：该脚本此前**存在但零 workflow 调用**，
      #   而设计文档（docs/p0a-s2-0-cosign-admission-design.md §7）与 policy-controller/
      #   application.yaml、各 CIP 文件的注释都声称"CIP 由 verify-cip-sync.sh 守漂移"——
      #   守门脚本没接线 = 那些声称全是空头承诺，四 CIP 契约（数量/glob/mode/身份/字段收紧）
      #   可以静默漂移而无人发现。
      #
      #   为何**不**做 lane 门控、每个 PR 都跑：CIP 与信任根 allowed-images.yaml 的一致性
      #   与 image-pin lane 无关——任意 PR（含 lane=none）都可能改 CIP 或白名单。且本步只读
      #   base（可信侧）已 checkout 的文件、纯本地 yq 解析、无网络无凭据，耗时亚秒级，
      #   没有只在特定 lane 跑的理由。
      #
      #   刻意置于 lane 断言体系**之外**：它不是任何 lane 的处置步，故不参与"恰一 lane"
      #   sentinel 判定；失败时直接让 job fail（fail-closed），不影响既有 lane 语义。
      - name: Verify CIP ↔ trust-root contract (no drift)
        run: |
          set -euo pipefail
          # yq 与本 workflow 其它步骤同版本同校验和（供应链固定，失败即中止）。
          if ! command -v yq >/dev/null; then
            YQ_VER=v4.44.3
            YQ_SHA=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
            curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
            echo "${YQ_SHA}  /tmp/yq" | sha256sum -c - || { echo "::error::yq checksum 校验失败"; exit 1; }
            sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          fi
          yq --version
          bash scripts/image-pin/verify-cip-sync.sh

      # ★注册表 ↔ 磁盘 双向一致（#500）。与 cip-sync 同规格：每个 PR 都跑、
      #   置于 lane 断言体系之外、纯本地解析无网络无凭据。
      #
      #   ★反向那一半是安全关键：某目录有了 image-lock.yaml 却没登记进注册表，
      #     其 pin 变更就**不进任何 lane、不经 cosign 验签即可合入**，且 CI 全绿。
      #     aster-lsp 正是这样脱管七个月（#519）。这条守卫让"漏登记"立刻可见。
      - name: Verify registry ↔ disk sync (no unregistered image-lock)
        run: |
          set -euo pipefail
          # bootstrap 兼容：引入本机制的 PR 其 base 侧还没有该脚本（本 workflow 只跑
          # 可信 base 侧，见上方 checkout 注释）。此处跳过是安全的——base 没有它
          # 意味着该不变量此前本就不存在，跳过不会放行任何本应被拒的东西。
          if [[ ! -f scripts/image-pin/verify-registry-sync.sh ]]; then
            echo "::notice::base 侧无 verify-registry-sync.sh（bootstrap PR）→ 跳过"
            exit 0
          fi
          bash scripts/image-pin/verify-registry-sync.sh

      # ★广度守卫：断言每个应用渲染出的镜像都带 @sha256（2026-09-02 事故后补）。
      #
      #   事故：apps/aster-lang/lsp 曾 pin 在手工推送的遗留 tag `0.0.9`（构建于 1-27），
      #   而 CI 只发 `:${github.sha}`、从不更新它 —— 该 tag 冻结七个月，
      #   期间 6-17 加入的 WS token 门从未上线，结果是**公网未授权访问**。
      #
      #   本 workflow 的深度校验（cosign+freshness）按 **逐个硬编码的 env 路径** 生效
      #   （CLOUD_LOCK_PATH / RUNNER_LOCK_PATH），不是 glob —— 新应用不接线就完全脱管，
      #   而「漏接线」本身此前无人报警。这一步用 find 自动发现，**新增应用无需改任何文件**
      #   即纳入守卫，专治「压根没 pin / 接线漏了」。
      #
      #   与 verify-cip-sync 同样置于 lane 断言体系之外、每个 PR 都跑：
      #   任意 PR 都可能改 kustomization 的 images 段，纯本地渲染、无网络无凭据。
      - name: Verify every app is digest-pinned (no floating tags)
        run: |
          set -euo pipefail
          # ★bootstrap 兼容：本步与 lane 逻辑一样只跑**可信 base 侧**的脚本
          #   （见上方 checkout 注释：不 checkout head、不执行 head 代码）。
          #   引入本机制的那个 PR，其 base 上必然还没有该脚本 —— 若不判存在性，
          #   引入 PR 自己就会 exit 127 而永远合不进来（死锁）。
          #
          #   ★这里可以安全地跳过，与第 222 行「pin 路径命中但脚本缺失 → fail-closed」
          #     不同：那里跳过意味着**放行一个未验签的 pin 变更**；
          #     而本步是全局不变量检查，base 上没有它 = 该不变量此前本就不存在，
          #     跳过不会让任何本应被拒的东西通过。合入后每个 PR 都会正常跑。
          if [[ ! -f scripts/image-pin/verify-no-floating-tags.sh ]]; then
            echo "::notice::base 侧无 verify-no-floating-tags.sh（引入本机制的 bootstrap PR）→ 跳过"
            exit 0
          fi
          # ★不自行安装 kubectl：ubuntu-latest runner 预装了 kubectl（实测 v1.36.4，
          #   内置 Kustomize v5.8.1）。此前写的 `command -v kubectl || 安装固定版本`
          #   **永远走不到安装分支**，等于假装做了供应链固定 —— 那种「看起来固定、
          #   实际用的是别人给的二进制」比不写更有害。
          #   本步只做纯本地渲染、不下载任何东西，故直接用 runner 自带的即可。
          kubectl version --client
          bash scripts/image-pin/verify-no-floating-tags.sh

      - name: Compute changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr
          # ★Task A4 Blocker 2 修正：GitHub PR files API 对 renamed 文件只把新路径放进
          #   `.filename`，旧路径在 `.previous_filename`。若只取 `.filename`，把受控路径（如
          #   runner/image-lock.yaml）重命名走会让 detection 漏检该 rename-away 动作
          #   （旧路径消失、新路径非受控 → pin_flavor=none → no-op）。故 changed-files 必须
          #   同时收纳 `.filename` 与 `.previous_filename`（rename 场景下两者都要能命中受控路径判定，
          #   使 rename-away 仍进 strict path，由 check-pr-shape 的 whitelist 拒掉多余/异常路径）。
          # ★Codex 抓 Critical：PR files API 硬上限 3000 文件（--paginate 不能突破）。若 PR 改 >3000 文件，
          #   某受控文件可能落在未返回部分 → detection 漏检 → 假绿绕过。故须**完整性校验**：取 PR 元数据的
          #   changed_files 计数，与 files API 实际返回的**对象数**比对，不一致或 >3000 → fail-closed。
          declared_changed="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.changed_files')"
          if [[ "$declared_changed" -gt 3000 ]]; then
            echo "::error::PR 改动文件数 ${declared_changed} > 3000（GitHub files API 硬上限，detection 无法完整枚举）→ fail-closed。请拆分 PR。"
            exit 1
          fi
          # 取 files API 全量为**每对象一行 JSON**（jq -c）——★不用裸 TAB TSV（Codex 抓 Critical：
          #   git 文件名可含 TAB/换行，裸 TSV 会被 awk 拆错，攻击者可让越界路径重构成授权路径绕过）。
          #   计数用 JSON 对象行数；派生 changed-files/status 全程 jq 提字段（不按分隔符切不可信文件名）。
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | {status, filename, previous_filename}' | jq -c '.' > /tmp/pr/files.jsonl
          returned_count="$(jq -s 'length' /tmp/pr/files.jsonl)"
          if [[ "$returned_count" != "$declared_changed" ]]; then
            echo "::error::files API 返回对象数 ${returned_count} != PR 元数据 changed_files ${declared_changed}（截断/不一致）→ fail-closed"
            exit 1
          fi
          # ★Codex 抓 Critical：git 文件名可含换行/TAB/控制字符 → 逐行 grep/awk 消费者会被「记录边界注入」
          #   （一个恶意文件名含 \n 被拆成多个「授权路径」行绕过）。故**前置**拒绝任何 filename/previous_filename
          #   含控制字符（\x00-\x1f 含 \t\n\r）。合法 runner manifest 路径绝无控制字符；有即 fail-closed。
          #   这使下游所有逐行 grep -qxF/awk/while-read 消费者恢复安全（无文件名可跨行或含分隔符）。
          if jq -e '[.filename, .previous_filename // empty] | .[] | select(test("[\\x00-\\x1f]"))' /tmp/pr/files.jsonl >/dev/null 2>&1; then
            echo "::error::PR 改动文件名含控制字符（换行/TAB 等）→ fail-closed（防逐行消费者记录边界注入）"
            jq -r '[.filename, .previous_filename // empty] | .[] | select(test("[\\x00-\\x1f]")) | @json' /tmp/pr/files.jsonl >&2 || true
            exit 1
          fi
          # 从 JSONL 派生：changed-files（filename + rename 的 previous_filename，各一行）；changed-status
          #   （status + filename）。★逐行消费者的注入安全**由上方前置控制字符拒绝提供**（通过本关的文件名
          #   保证无换行/TAB/控制字符，故不能跨行或含分隔符）——非 jq -r 本身（jq -r 会原样输出文件名内的
          #   控制字符）。changed-status 的 filename 列不参与安全判定（安全判定全走 changed-files 的
          #   grep -qxF 全行精确匹配 + awk 只读 status 枚举列）。
          jq -r '.filename, (.previous_filename // empty)' /tmp/pr/files.jsonl > /tmp/pr/changed-files.txt
          # changed-status：仅供 awk 判 renamed/removed status（第一列枚举），filename 列不参与安全判定
          #   （安全判定全走 changed-files.txt 的 grep -qxF）。status 是 GitHub 受控枚举，无注入面。
          jq -r '[.status, .filename] | @tsv' /tmp/pr/files.jsonl > /tmp/pr/changed-status.txt
          echo "改动文件（含 rename previous_filename，完整性校验 ${returned_count}==${declared_changed}）："; cat /tmp/pr/changed-files.txt
          # 验签脚本只从**可信 base 侧**运行（不信 PR 改动的验签器代码）。若 base 尚无这些
          # 脚本（引入本机制的 bootstrap PR 自身），则无法在此 PR 上验签。
          if [[ -f scripts/image-pin/verify-image-pin.sh && -f scripts/image-pin/check-pr-shape.sh ]]; then
            scripts_present=true
          else
            scripts_present=false
            echo "::notice::base 侧无 image-pin 验签脚本（bootstrap PR）"
          fi
          # ★★detection 由**注册表**驱动（#500），不再逐个 flavor 硬编码。
          #   任一应用的 image-lock 被改 → strict path。改 kustomization(images 段)/
          #   deploy-policy 而不改对应 image-lock 的 PR 也进 strict（由 check-pr-shape 拒），防绕过。
          #
          #   互斥不变量不变：一个 image-pin PR 只 pin 一个应用。命中多个 → 标为
          #   multi（非法形状），让 strict path 跑起来拒它——**不能**静默取其一，
          #   否则跨应用 PR 会被当成单应用 PR 而只校验一半。
          #
          # ★deploy-policy 是触发路径（Codex 抓跨 PR 绕过）：strict render-guard 从可信 base 读
          #   它的 deferredImages 作 render 豁免依据。若单独改它能走 no-op，攻击者可
          #   PR-A 单独加恶意豁免（no-op success）→合入成可信 base→PR-B 的 render-guard 读该
          #   base 豁免跳过 render。故单独改它 → 无 image-lock → invalid。
          #
          # ★deployment.yaml **不是**触发路径（go-live topology lane 退休后）：它不含 pin 数据
          #   （pin 真相 = image-lock + kustomization.images），改它（replicas/探针等日常运维）走 none。
          #
          # ★kustomization.yaml 按**内容**而非文件名触发（五层法第一层：数据结构定边界）：
          #   该文件承载两类互不相干的内容——
          #     (a) images 段    = pin 数据本体，必须严守；
          #     (b) resources 段 = 清单注册，加 PDB/NetworkPolicy 等日常运维**必须**改这里。
          #   按文件名一刀切会让任何「新增清单」的 PR 判 invalid——那只是把「死门禁拦一切」
          #   换成「粗门禁拦一切加清单」。故只在 images 段**实际变化**时才触发。
          #   安全性不依赖本判定：verify-rendered-by-digest*.yml 对所有相关 PR 无条件跑。
          pin_flavor=none
          matched=""
          # shellcheck disable=SC2034  # DEPLOY 刻意不参与 detection——见下方说明
          while IFS=$'\t' read -r APP LOCK KUST DEPLOY POLICY; do
            [[ -z "$APP" ]] && continue
            # ★DEPLOY（deployment.yaml）**故意不作触发路径**：它不含 pin 数据
            #   （pin 真相 = image-lock + kustomization.images），改它属日常运维
            #   （replicas/探针/PDB）应走 lane=none。它只在 strict path 里作为
            #   env-bound 的**载体**被读取。这一行 read 保留它只为占住 TSV 列位。
            hit=false
            grep -qxF "$LOCK" /tmp/pr/changed-files.txt && hit=true
            if [[ -n "$POLICY" && "$POLICY" != "null" ]] \
               && grep -qxF "$POLICY" /tmp/pr/changed-files.txt; then hit=true; fi
            # kustomization 按 images 段内容判定
            if grep -qxF "$KUST" /tmp/pr/changed-files.txt; then
              # base 侧为已 checkout 的可信文件；head 侧仅作**数据**取用（不 checkout/执行 head 代码）。
              gh api "repos/${{ github.repository }}/contents/${KUST}?ref=${{ github.event.pull_request.head.sha }}" \
                --jq '.content' | base64 -d > "/tmp/pr/head-${APP}-kust.yaml"
              base_imgs="$(yq -o=json '.images // []' "$KUST" | jq -S -c '.')"
              head_imgs="$(yq -o=json '.images // []' "/tmp/pr/head-${APP}-kust.yaml" | jq -S -c '.')"
              if [[ "$base_imgs" != "$head_imgs" ]]; then
                hit=true
                echo ">> ${APP} kustomization.images 变更：$base_imgs → $head_imgs"
              else
                echo ">> ${APP} kustomization 被改但 images 段逐字节不变（清单注册等运维变更）"
              fi
            fi
            if [[ "$hit" == "true" ]]; then
              matched="${matched}${matched:+ }${APP}"
            fi
          done < <(yq -r '.apps[] | [.name, .lock, .kust, (.deploy // ""), (.policy // "")] | @tsv' "$APPS_REGISTRY")

          case "$(printf '%s' "$matched" | wc -w | tr -d ' ')" in
            0) pin_flavor=none ;;
            1) pin_flavor="$matched" ;;
            *) # 跨应用 → 非法形状，标 multi 进 strict 由 check-pr-shape 拒
               echo "::warning::PR 同时命中多个应用（$matched）——非法 image-pin 形状 → strict path 将拒"
               pin_flavor="multi" ;;
          esac
          echo ">> pin_flavor=$pin_flavor（注册表命中：${matched:-无}）"

          # ★Task A4 Blocker 3 修正：pin 路径被命中（pin_flavor != none）但 base 侧脚本缺失，
          #   曾经直接 no-op success——对永久安全关键 workflow 这是 fail-open（脚本若因任何原因
          #   在 main 上缺失/被删，pin PR 即可不经验签合入）。现在改为：脚本缺失且命中 pin 路径
          #   → 直接失败（非 no-op）；只有真正的非 pin PR（pin_flavor==none）才允许 no-op。
          #   bootstrap 首次引入机制这一特殊场景需要人工例外（跳过分支保护/手动合并），不再由
          #   本 workflow 自动放行。
          if [[ "$pin_flavor" != "none" && "$scripts_present" == "false" ]]; then
            echo "::error::PR 命中 image-pin 受控路径（pin_flavor=$pin_flavor），但 base 侧验签脚本缺失 → fail-closed（非 no-op）。若为首次引入机制的 bootstrap PR，须走人工例外流程，不由本 workflow 自动放行。"
            exit 1
          fi

          # ── lane 分派（完备互斥枚举，Codex 定）：none|cloud-pin|runner-pin|invalid ──
          # detection 只做**粗分**（看 changed-files/status）；精判（pin 数据真不变）交对应 lane
          #   校验器兜底（strict 走 check-pr-shape/cosign，从可信 base 独立 fail-closed）。
          #   骗进错 lane 都被该 lane 校验器拒。
          # ★runner-topology lane 已退休（一次性 go-live 迁移通道，迁移已完成）：其校验器第 [3/6] 步
          #   硬编码 expected_res = base_res + [deployment.yaml, external-secrets.yaml]，而这两项现已在
          #   base 内，故该 lane 永远不可能再通过——它唯一的现实作用是拦住一切合法 runner 配置变更
          #   （实测：加 pdb.yaml 即 fail-closed "目录文件集变更"）。死门禁本身即风险，故整体移除。
          # ★把命中应用的路径导出，供后续 step 使用（全部来自**可信 base 侧**注册表，
          #   非 PR 供值）。pin_flavor=none/multi 时为空。
          APP_LOCK=""; APP_KUST=""; APP_DEPLOY=""; APP_POLICY=""
          if [[ "$pin_flavor" != "none" && "$pin_flavor" != "multi" ]]; then
            # ★yq(mikefarah) 无 --arg（那是 jq 语法），传变量用 strenv。
            read -r APP_LOCK APP_KUST APP_DEPLOY APP_POLICY < <(
              PIN_APP="$pin_flavor" yq -r \
                '.apps[] | select(.name == strenv(PIN_APP)) | [.lock, .kust, (.deploy // ""), (.policy // "")] | @tsv' \
                "$APPS_REGISTRY")
          fi
          {
            echo "app_lock=$APP_LOCK"
            echo "app_kust=$APP_KUST"
            echo "app_deploy=$APP_DEPLOY"
            echo "app_policy=$APP_POLICY"
          } >> "$GITHUB_OUTPUT"

          lane=none
          if [[ "$pin_flavor" == "multi" ]]; then
            # 跨应用 PR：非法形状，进 strict 由 check-pr-shape 拒（不静默取其一）。
            lane=invalid
          elif [[ "$pin_flavor" != "none" ]]; then
            # 命中某个应用：改了 image-lock → <app>-pin（strict 全链验签）。
            if grep -qxF "$APP_LOCK" /tmp/pr/changed-files.txt; then
              lane="${pin_flavor}-pin"
            else
              # 未碰 image-lock 却碰了 kustomization（含 images 段=pin 数据本体）或 deploy-policy
              #   （render 豁免来源）→ 非法形状，fail-closed。
              # ★保留此分支是 Codex 抓的跨 PR 绕过的堵点：deploy-policy 单独改**必须** invalid，
              #   否则攻击者可 PR-A 加恶意 deferredImages 走 no-op 绿灯合入成可信 base，
              #   PR-B 的 render-guard 读该 base 豁免即可跳过 render 校验。
              echo "::warning::PR 改了 ${pin_flavor} 的 kustomization/deploy-policy 但未改 image-lock（非法 pin 形状）→ invalid"
              lane=invalid
            fi
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo ">> 分派 lane=$lane（pin_flavor=$pin_flavor）"
          # touches_lock 供既有 strict 步条件复用。
          # ★★必须按**模式**判定（*-pin）而非枚举具体 lane 名：旧版硬编码
          #   `lane == cloud-pin || lane == runner-pin`，新增应用后其 lane（如 lsp-pin）
          #   不在名单里 → touches_lock=false → **整条 strict path 被跳过**，
          #   即新应用的 pin PR 不经 cosign 验签就能合入。这是 fail-open，
          #   而且表现为"CI 全绿"，比报错更危险。
          case "$lane" in
            *-pin) echo "touches_lock=true"  >> "$GITHUB_OUTPUT" ;;
            *)     echo "touches_lock=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "pin_flavor=$pin_flavor" >> "$GITHUB_OUTPUT"
        id: changed

      # ── invalid lane：碰了 runner kustomization（images 段）或 deploy-policy（render 豁免源）却没改 image-lock → explicit failure ──
      - name: Invalid image-pin shape (explicit failure)
        if: steps.changed.outputs.lane == 'invalid'
        run: |
          echo "::error::PR 改了某应用的 kustomization.yaml（含 images 段=pin 数据）或 deploy-policy.yaml（render 豁免来源）但未改对应 image-lock.yaml，或同时命中多个应用 → fail-closed。合法 pin PR 须由 image-pin bot 双写 image-lock + kustomization.images，且只针对**一个**应用。若只想改日常运维配置（replicas/PDB/探针等），改 deployment.yaml / 新增独立清单文件即可（走 lane=none）。"
          exit 1

      # ── 分流 A：非 pin PR（lane=none）→ no-op（发 success，不做验签）──
      - name: No-op for non-image-pin PR
        id: noop
        if: steps.changed.outputs.lane == 'none'
        run: echo "本 PR 未改 image-lock/kustomization → verify-image-pin no-op（人工 PR 走其它 review 规则）"

      # ── 分流 B：改了 image-lock → 严格路径 ──
      - name: Fetch PR-head 数据 (binding-mode aware，不 checkout head 代码)
        if: steps.changed.outputs.touches_lock == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_FLAVOR: ${{ steps.changed.outputs.pin_flavor }}
          APP_LOCK: ${{ steps.changed.outputs.app_lock }}
          APP_KUST: ${{ steps.changed.outputs.app_kust }}
          APP_DEPLOY: ${{ steps.changed.outputs.app_deploy }}
          APP_POLICY: ${{ steps.changed.outputs.app_policy }}
        run: |
          set -euo pipefail
          # ★image-lock 路径来自**注册表**（detection 步已按命中应用导出，见 app_lock）。
          #   全部取自可信 base 侧，非 PR 供值。
          LOCK="$APP_LOCK"
          # 取 head image-lock（数据）。
          gh api "repos/${{ github.repository }}/contents/${LOCK}?ref=${{ github.event.pull_request.head.sha }}" \
            --jq '.content' | base64 -d > /tmp/pr/head-image-lock.yaml
          echo "PR-head image-lock sha256: $(sha256sum /tmp/pr/head-image-lock.yaml | cut -d' ' -f1)"
          # base（可信 checkout 侧）作为 diff 基线；base 无该文件则空。
          cp "$LOCK" /tmp/pr/base-image-lock.yaml 2>/dev/null || echo 'images: []' > /tmp/pr/base-image-lock.yaml
          # ★载体按**注册表声明**取，而非按 flavor 名分支。
          #   一个应用可能同时有 env-bound（deploy）与 kustomization-bound（kust）两类 pin
          #   （runner 即如此，两者共用同一 image-lock）；按 PR 实际改了哪个载体分别取数据。
          #   一个 image-pin PR 只改其一。
          if [[ -n "$APP_DEPLOY" ]] && grep -qxF "$APP_DEPLOY" /tmp/pr/changed-files.txt; then
            gh api "repos/${{ github.repository }}/contents/${APP_DEPLOY}?ref=${{ github.event.pull_request.head.sha }}" \
              --jq '.content' | base64 -d > /tmp/pr/head-deployment.yaml
            cp "$APP_DEPLOY" /tmp/pr/base-deployment.yaml
            echo "${PIN_FLAVOR} env-bound：取 deployment 数据"
          fi
          if grep -qxF "$APP_KUST" /tmp/pr/changed-files.txt; then
            gh api "repos/${{ github.repository }}/contents/${APP_KUST}?ref=${{ github.event.pull_request.head.sha }}" \
              --jq '.content' | base64 -d > /tmp/pr/head-kustomization.yaml
            echo "PR-head kustomization sha256: $(sha256sum /tmp/pr/head-kustomization.yaml | cut -d' ' -f1)"
            cp "$APP_KUST" /tmp/pr/base-kustomization.yaml
            echo "${PIN_FLAVOR} kustomization-bound：取 kustomization 数据"
          fi
          # ★render 豁免策略只从**可信 base 侧**读（非 PR head）——deferral 是 main 既定状态，
          #   PR 不得在本次变更中新声明豁免绕过 render。未声明 policy 或 base 无该文件 → 空列表（无豁免）。
          if [[ -n "$APP_POLICY" ]]; then
            cp "$APP_POLICY" /tmp/pr/base-deploy-policy.yaml 2>/dev/null \
              || echo 'deferredImages: []' > /tmp/pr/base-deploy-policy.yaml
          else
            # 该应用无 deferral 概念；render-guard 无条件读该文件，故置空列表兜底。
            echo 'deferredImages: []' > /tmp/pr/base-deploy-policy.yaml
          fi

      - name: Check PR shape (blocker2 纵深，binding-mode aware)
        if: steps.changed.outputs.touches_lock == 'true'
        env:
          IMAGE_PIN_BOT_LOGIN: ${{ vars.IMAGE_PIN_BOT_LOGIN }}
          IMAGE_PIN_BOT_ID: ${{ vars.IMAGE_PIN_BOT_ID }}
          PIN_FLAVOR: ${{ steps.changed.outputs.pin_flavor }}
          APP_LOCK: ${{ steps.changed.outputs.app_lock }}
          APP_KUST: ${{ steps.changed.outputs.app_kust }}
          APP_DEPLOY: ${{ steps.changed.outputs.app_deploy }}
          APP_POLICY: ${{ steps.changed.outputs.app_policy }}
        run: |
          set -euo pipefail
          # ★按 flavor 传 image-lock 与部署真相 env（路径全来自可信 base 侧 env 常量，非 PR 供值）。
          #   runner 下再按改动集分流：launcher(改 runner/kustomization.yaml) 传 KUSTOMIZATION_PATH；
          #   env-bound runner(改 runner/deployment.yaml) 传 DEPLOYMENT_PATH；cloud 传 KUSTOMIZATION_PATH（不变）。
          # 按 PR 实际改的载体决定白名单（路径全来自可信 base 侧注册表，非 PR 供值）：
          #   改了 kustomization → whitelist {image-lock, kustomization}
          #   改了 deployment    → whitelist {image-lock, deployment}（env-bound）
          if grep -qxF "$APP_KUST" /tmp/pr/changed-files.txt; then
            IMAGE_LOCK_PATH="$APP_LOCK" \
            KUSTOMIZATION_PATH="$APP_KUST" \
              bash scripts/image-pin/check-pr-shape.sh "$GITHUB_EVENT_PATH" /tmp/pr/changed-files.txt
          else
            IMAGE_LOCK_PATH="$APP_LOCK" \
            DEPLOYMENT_PATH="$APP_DEPLOY" \
              bash scripts/image-pin/check-pr-shape.sh "$GITHUB_EVENT_PATH" /tmp/pr/changed-files.txt
          fi

      - name: Install cosign
        if: steps.changed.outputs.touches_lock == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Install yq (pinned + checksum)
        if: steps.changed.outputs.touches_lock == 'true'
        run: |
          set -euo pipefail
          YQ_VER=v4.44.3
          # 真实 sha256（yq_linux_amd64 v4.44.3，直接对二进制核实）。供应链固定，失败即中止。
          YQ_SHA=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
          echo "${YQ_SHA}  /tmp/yq" | sha256sum -c - || { echo "::error::yq checksum 校验失败"; exit 1; }
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # ★跨仓只读 token：freshness 要查**源仓**（aster-api / aster-cloud）的 HEAD。
      #   aster-api 转私后，k3s 的 github.token 只对本仓有效 → 查源仓 404 →
      #   `entry[n] 取 <repo>@main 当前 HEAD 失败` → image-pin fail-closed（2026-08-02 实测）。
      #   故用已有的 image-pin App 换一枚含 contents:read 的 token。
      #   ★不新增 PAT：App token 短时有效、可审计、可随时撤销安装。
      #   ⚠️ 需先在该 App 设置里把 aster-api / aster-cloud 加入安装仓库并授予
      #      Repository permissions → Contents: Read-only，否则本步取到的 token 仍读不到源仓。
      - name: Mint cross-repo read token (freshness)
        id: srctoken
        if: ${{ steps.changed.outputs.touches_lock == 'true' && vars.IMAGE_PIN_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # 只要源仓的读权限；不给写、不涉及其它仓。
          repositories: |
            aster-api
            aster-cloud
          permission-contents: read

      - name: Verify image-lock (only changed entries; cosign + freshness, binding-mode aware)
        if: steps.changed.outputs.touches_lock == 'true'
        env:
          # ★优先用 App token（可读私有源仓）；App 未配置时回落 github.token——
          #   后者只对本仓有效，源仓转私后会 404，届时 fail-closed 是正确行为。
          GH_TOKEN: ${{ steps.srctoken.outputs.token || github.token }}
          IMAGE_PIN_FRESHNESS: latest-only
          PIN_FLAVOR: ${{ steps.changed.outputs.pin_flavor }}
        run: |
          set -euo pipefail
          # ★runner：按上一步实际取到的数据文件传参——env-bound(aster-replay-runner) 传 head/base
          #   deployment(参数 6/7)，launcher(kustomization-bound) 传 head/base kustomization(参数 4/5)。
          #   一个 image-pin PR 只改其一，故两组参数中总有一组为空字符串（verify-image-pin.sh 视为未提供）。
          #   cloud：传 head/base kustomization（参数 4/5，deployment 参数不传），行为不变。
          if [[ "$PIN_FLAVOR" == "runner" ]]; then
            HEAD_KUST_ARG=""; BASE_KUST_ARG=""; HEAD_DEP_ARG=""; BASE_DEP_ARG=""
            [[ -f /tmp/pr/head-kustomization.yaml ]] && { HEAD_KUST_ARG=/tmp/pr/head-kustomization.yaml; BASE_KUST_ARG=/tmp/pr/base-kustomization.yaml; }
            [[ -f /tmp/pr/head-deployment.yaml ]]    && { HEAD_DEP_ARG=/tmp/pr/head-deployment.yaml;    BASE_DEP_ARG=/tmp/pr/base-deployment.yaml; }
            bash scripts/image-pin/verify-image-pin.sh \
              .github/image-pin/allowed-images.yaml \
              /tmp/pr/base-image-lock.yaml \
              /tmp/pr/head-image-lock.yaml \
              "$HEAD_KUST_ARG" "$BASE_KUST_ARG" \
              "$HEAD_DEP_ARG" "$BASE_DEP_ARG"
          else
            bash scripts/image-pin/verify-image-pin.sh \
              .github/image-pin/allowed-images.yaml \
              /tmp/pr/base-image-lock.yaml \
              /tmp/pr/head-image-lock.yaml \
              /tmp/pr/head-kustomization.yaml \
              /tmp/pr/base-kustomization.yaml
          fi

      # ── Phase 3 keystone 渲染层校验：kubectl kustomize 出的每个变更镜像必须是 @sha256 ──
      # 用 base(可信) checkout 的其它 manifest + head 的 kustomization/image-lock（数据）。
      # 只校验渲染结果含 by-digest（image-lock 的 digest 已在上一步验签）。
      - name: Verify kustomize renders by-digest (binding-mode aware)
        id: renderguard
        if: steps.changed.outputs.touches_lock == 'true'
        env:
          PIN_FLAVOR: ${{ steps.changed.outputs.pin_flavor }}
          APP_KUST: ${{ steps.changed.outputs.app_kust }}
        run: |
          set -euo pipefail
          # render 校验只对 kustomization-bound 镜像有意义（渲染出 name@sha256）。选目标树：
          #   cloud PR → 渲 cloud 树；runner 里的 launcher(kustomization-bound) PR → 渲 runner 树；
          #   runner env-bound PR（只改 deployment，无 head-kustomization）→ 跳过 render（env 无静态渲染，
          #   其部署真相已由 verify 的 env value + deployment semantic-diff 保证）。
          # ★★TREE 必须从**注册表**派生，不能 if runner / else cloud。
          #   旧写法下 lsp（及任何新应用）都落 else 分支 → 把 lsp 的 kustomization
          #   **覆盖进 cloud 目录**，再渲染 cloud 树 —— 渲出来的是 aster-api 的镜像。
          #   它恰好因为 grep 不到 lsp 的 digest 而红了，但那是**巧合不是设计**：
          #   真正的问题是 lsp 的部署渲染从未被校验过。若 cloud 树里碰巧有该镜像
          #   引用，这里就会绿，而 lsp 自己的树一眼没看。
          #   ——校验错对象比不校验更危险，因为它看起来在工作。
          TREE="$(dirname "$APP_KUST")"
          if [[ ! -f /tmp/pr/head-kustomization.yaml ]]; then
            # env-bound PR（只改 deployment，无 kustomization 变更）→ 跳过 render
            # （env 无静态渲染，其部署真相已由 verify 的 env value + deployment semantic-diff 保证）。
            echo ">> ${PIN_FLAVOR} env-bound PR（无 kustomization 变更）→ 跳过 render"
            exit 0
          fi
          cp /tmp/pr/head-kustomization.yaml "$TREE/kustomization.yaml"
          cp /tmp/pr/head-image-lock.yaml    "$TREE/image-lock.yaml"
          rendered="$(kubectl kustomize "$TREE")"
          # 只对**在 kustomization.images 里的镜像**做 render 校验（env-bound 的 runner 镜像不在其中，跳过）。
          #   image-lock 转 JSON（数值标量转字符串防精度损坏）。
          lock_json="$(yq -o=json '(.. | select(tag=="!!int" or tag=="!!float"))|=tostring' /tmp/pr/head-image-lock.yaml)"
          kust_json="$(yq -o=json '.' /tmp/pr/head-kustomization.yaml)"
          # ★render 豁免（deferredImages）从**可信 base 侧 deploy-policy.yaml** 读（非 PR head，也非
          #   image-lock）：(1) 从 head 读=PR 可偷加豁免绕 render；(2) 放 image-lock=人工加策略字段被
          #   image-pin shape 门当非法 PR 拒 + 污染 pin 数据模型。deferral 是部署策略事实、是 main 既定
          #   状态，PR 不得在本次变更中新声明豁免。deploy-policy.yaml 不在 pin 门控路径，人工改它走普通
          #   review（pin_flavor=none → no-op）。
          deferred_json="$(yq -o=json '.' /tmp/pr/base-deploy-policy.yaml)"
          n="$(jq '.images | length' <<<"$lock_json")"
          for k in $(seq 0 $((n - 1))); do
            img="$(jq -r ".images[$k].image"  <<<"$lock_json")"
            dig="$(jq -r ".images[$k].digest" <<<"$lock_json")"
            # 该镜像是否在 base deploy-policy 的 deferredImages 显式列出（按镜像名匹配）。
            deferred="$(jq -r --arg img "$img" '([.deferredImages[]? | select(.image == $img)] | length) > 0' <<<"$deferred_json")"
            # 该镜像若不在 kustomization.images（env-bound，如 aster-replay-runner）→ 不参与静态渲染，跳过。
            in_kust="$(jq -r --arg img "$img" '[.images[]? | select(.name == $img)] | length' <<<"$kust_json")"
            [[ "$in_kust" == "1" ]] || { echo ">> ${img} 非 kustomization-bound（不进静态渲染），跳过 render 校验"; continue; }
            # ★显式 deferred（deploy-policy.yaml deferredImages 列出，Codex 审：仅**显式**才豁免）——
            #   镜像 pin 正确但其 Deployment 显式移出 kustomization resources（go-live 门），不被渲染引用、
            #   不出现在 render 输出。故不强制它 render by-digest；其 pin 一致性仍由前面 verify-image-pin.sh
            #   的 kust_digest==image-lock digest 守。★未在 deferredImages 列出的镜像若不渲染 → 下方 grep
            #   失败 fail-closed（防「Deployment 意外移出 resources」被静默放过——不是无条件跳过未渲染镜像）。
            if [[ "$deferred" == "true" ]]; then
              echo ">> ${img} 在 base deploy-policy.deferredImages 显式列出（Deployment deferred 出 kustomization，go-live 门）→ 跳过 render 校验（pin 一致性仍由 kust_digest==digest 守）"
              continue
            fi
            grep -qF "${img}@${dig}" <<<"$rendered" \
              || { echo "::error::kustomize 渲染未见 ${img}@${dig}（部署未 by-digest；若为显式 deferred 须在 deploy-policy.yaml 的 deferredImages 列出该镜像）"; exit 1; }
            echo ">> 渲染校验 OK：${img}@${dig}"
          done

      # ── 恰一 lane 断言（Codex 定，防「条件写错致全 lane skipped 但 job 仍 success」的假绿）──
      # ★用 lane 枚举本身判：lane 必须是 4 合法值之一；且对应 lane 的处置步已跑（none→no-op；
      #   cloud-pin|runner-pin→strict；invalid 已在前面 exit 1 使 job 失败）。
      #   若 lane 是未知值或空 → explicit failure。
      - name: Assert exactly one lane (anti-false-green)
        if: ${{ always() }}
        env:
          LANE: ${{ steps.changed.outputs.lane }}
          CHANGED_OUTCOME: ${{ steps.changed.outcome }}
          NOOP_OUTCOME: ${{ steps.noop.outcome }}
          RENDERGUARD_OUTCOME: ${{ steps.renderguard.outcome }}
        run: |
          set -euo pipefail
          # detection 步本身若失败/跳过 → job 已非正常，交由 job.status 表达；此处只在 detection 成功时校验 lane。
          if [[ "$CHANGED_OUTCOME" != "success" ]]; then
            echo ">> detection 步 outcome=$CHANGED_OUTCOME（非 success）→ 由 job.status 表达，跳过 lane 断言"
            exit 0
          fi
          # ★不止校验枚举合法，还须校验**对应 lane 的处置步真的跑了**（outcome 匹配），防某 lane 条件
          #   写错致全 skip 但 job 仍 success 的假绿（Codex 抓）。sentinel：none→noop；cloud-pin|runner-pin
          #   →renderguard（strict 最终步）；invalid→前面已 exit 1（job 必 fail）。
          echo ">> lane=$LANE noop=$NOOP_OUTCOME renderguard=$RENDERGUARD_OUTCOME"
          case "$LANE" in
            none)
              [[ "$NOOP_OUTCOME" == "success" ]] \
                || { echo "::error::lane=none 但 no-op 步 outcome=$NOOP_OUTCOME（非 success）→ 条件错配 fail-closed"; exit 1; } ;;
            # ★必须按**模式**匹配（*-pin）而非枚举 lane 名 —— 与上面 touches_lock 同一口径。
            #   枚举写法下，注册表新增应用后其 lane（如 lsp-pin）不在名单里 → 落到 *) 分支
            #   被判「lane 枚举非法」→ **strict 全链跑通并通过之后仍把 job 判死**。
            #   那是死门禁：报错指向 detection，真凶却在本断言步。
            #   本 PR 第一版就栽在这里（CI 实测 lane 枚举非法或空），与 touches_lock 同构。
            *-pin)
              # strict lane 最终 sentinel = render-guard（touches_lock 全链最后一步；前置任一失败 job 已 fail）。
              [[ "$RENDERGUARD_OUTCOME" == "success" ]] \
                || { echo "::error::lane=$LANE 但 render-guard(strict 最终步) outcome=$RENDERGUARD_OUTCOME（非 success）→ strict 链未完整跑 fail-closed"; exit 1; } ;;
            invalid)
              # invalid 步已 exit 1 使 job fail；本断言（always）能到这里说明 job 会以 failure 收尾，不放绿。
              echo ">> lane=invalid（Invalid 步已 fail job）" ;;
            *) echo "::error::lane 枚举非法或空：'$LANE' → fail-closed（防未知 lane 假绿）"; exit 1 ;;
          esac
          echo ">> 恰一 lane 断言通过"

      # ── 发 check run 用 image-pin App token（使 required-check source = App, blocker2 X3）──
      # 无论 no-op 还是严格路径，只要走到这里(前面步骤未失败)即发 success；失败路径由 job 失败
      # 表现为 required check 缺失/红。需仓库配置 vars.IMAGE_PIN_APP_ID + secrets.IMAGE_PIN_APP_PRIVATE_KEY。
      - name: Mint image-pin App token
        id: apptoken
        if: ${{ always() && vars.IMAGE_PIN_APP_ID != '' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          # client-id 取代已弃用的 app-id（create-github-app-token@v3 弃用警告）。
          client-id: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PIN_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Publish verify-image-pin check run (App source)
        if: ${{ always() && vars.IMAGE_PIN_APP_ID != '' }}
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}          # success / failure
          LANE: ${{ steps.changed.outputs.lane }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            conclusion=success
            summary="verify-image-pin 通过（lane=${LANE}；no-op / cosign+freshness 全过）"
          else
            conclusion=failure
            summary="verify-image-pin 失败（lane=${LANE}），见 job 日志"
          fi
          gh api -X POST "repos/${{ github.repository }}/check-runs" \
            -f name='verify-image-pin' \
            -f head_sha="$HEAD_SHA" \
            -f status='completed' \
            -f conclusion="$conclusion" \
            -f 'output[title]=verify-image-pin' \
            -f "output[summary]=${summary}" \
            >/dev/null
          echo "已用 image-pin App 身份发 $conclusion check run"
