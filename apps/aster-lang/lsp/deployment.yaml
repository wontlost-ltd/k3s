# Aster LSP WebSocket Server Deployment
# Language Server Protocol proxy for Monaco editor integration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aster-lsp
  namespace: aster-lsp
  labels:
    app: aster-lsp
    app.kubernetes.io/name: aster-lsp
    app.kubernetes.io/part-of: aster-lang
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aster-lsp
  template:
    metadata:
      labels:
        app: aster-lsp
        app.kubernetes.io/name: aster-lsp
    spec:
      automountServiceAccountToken: false
      # R30+ audit P1：显式 grace period，让 in-flight LSP 请求在 SIGTERM 后
      # 有时间走完，避免 client（IDE）看到"半个补全"的截断响应。
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aster-lsp
          # ★这里的 tag 只是占位，**不是**生产在跑的版本（issue #583）。
          #   真正生效的引用由同目录 kustomization.yaml 的 images 段渲染成
          #   `aster-lsp@sha256:<digest>`（scripts/image-pin/verify-no-floating-tags.sh
          #   在每个 PR 上断言渲染结果必须带 digest）。
          #   digest 是不可变的，故 IfNotPresent 不会再有「同 tag 换内容却不拉」的问题；
          #   要换版本改 kustomization.yaml / image-lock.yaml，不要改这一行。
          image: docker.io/wontlost/aster-lsp:0.0.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            # Server configuration
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            # CORS - allowed origins for WebSocket connections
            # ★ No localhost here. This manifest is production-only (flat dir, no
            #   dev overlay), so an http://localhost:3000 entry never serves local
            #   development — it only means any page a visitor happens to be running
            #   on their own port 3000 counts as an allowlisted origin against the
            #   production LSP WebSocket. Local dev should point at a local LSP, or
            #   carry this override in a dev-only overlay.
            - name: ALLOWED_ORIGINS
              value: "https://aster-lang.cloud,https://www.aster-lang.cloud"
            # ★共享 token —— 缺它则生产环境**全部连接被拒**（401
            #   "Token gate not configured"，见 lsp-server.mjs 的 evaluateUpgrade
            #   第 4 步；Dockerfile.lsp 已设 NODE_ENV=production）。
            #   由 external-secrets.yaml 从 Vault 下发。
            - name: LSP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aster-lsp-auth
                  key: LSP_AUTH_TOKEN
            # ★每 pod 并发会话上限（网关 evaluateUpgrade 第 1 步，默认 50 远超内存所能承受）。
            #   每个会话 spawn 一个语言服务器子进程。实测（node:24-slim，Linux，aster-lsp 同版本
            #   aster-lang-ts，打开内置 Auto Insurance 模板 + 10 次 hover 后）：
            #     网关进程 RSS ≈ 58→63 MiB；每个子进程 RSS ≈ 75–80 MiB（5 个会话：77/80/80/79/80）。
            #   按每会话 96 MiB 预算（实测上沿 80 + 20% 余量，长会话索引增长），容器上限留 15% 余量：
            #     (768 MiB × 0.85 − 64 MiB) / 96 MiB ≈ 6.1 → 6
            #   两副本共 12 个并发编辑器会话。单 IP 的并发会话与握手速率由网关进程内限流负责
            #   （aster-cloud fix/lsp-gateway-limits；tunnel 直连本 Service、不经 Traefik，入口中间件不生效）。
            #   子进程不继承 NODE_OPTIONS，网关以 --max-old-space-size=128 启动子进程。
            - name: LSP_MAX_CONNECTIONS
              value: "6"
            # Node.js tuning（只作用于网关进程本身）
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # ★内存上限与 LSP_MAX_CONNECTIONS 一起定（计算见上方 env 注释）：原 256Mi 只够网关加
          #   约 1.6 个会话，原上限 50 个会话时几个连接就会 OOM。request 按「网关 + 两个常驻会话」估算，
          #   峰值靠 limit 兜住；上限 6 会话 × 2 副本时最坏占用 2 × 768Mi。
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
      volumes:
        - name: tmp
          emptyDir: {}
