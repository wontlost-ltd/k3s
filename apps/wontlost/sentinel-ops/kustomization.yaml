apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
# network-policy.yaml 暂不引用，原因见该文件顶部的 rollout note。

# 镜像引用由应用仓库 (wontlost-ltd/vaadin-motion) 的 release-demo.yml
# 通过 `kustomize edit set image` 自动写入 immutable digest。
#
# 首次引入本应用时这里放的是无 digest 的占位 tag，被 verify-no-floating-tags
# 正确拦下——本仓库要求所有镜像 digest 固定，占位不能例外。现已由首次
# demo-v0.1.0 发布写入真实 digest。
images:
- digest: sha256:00815537bd554e35ec766d176a0de849e8c5df25cd2e934e603a90cdd60eda58
  name: wontlost/sentinel-ops
  newName: wontlost/sentinel-ops
  newTag: 0.1.1
