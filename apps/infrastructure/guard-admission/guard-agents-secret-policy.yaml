# aster-agents 的 Secret 准入白名单（aster-api ADR 0054 §12 D9；计划 Task 7c）。
#
# 部署层探针 SA 在 aster-agents 有 pods/create，等于间接读取该命名空间内**全部** Secret（Pod 可经 secretKeyRef /
# Secret 卷挂载，不需要 secrets/get）。git 侧的 manifests.test.sh 只管得住 git 里的清单，管不住手工或其它控制器
# 写入的 Secret，所以在集群侧拒绝 aster-agents 内除 guard-demo-agent（Opaque，金丝雀 Agent token）以外的任何 Secret。
#
# 只匹配 CREATE：Secret 的名称与 type 都不可变，UPDATE 无法把一个 Secret 变成白名单外的名字或类型；
# 策略生效前已存在的 Secret 由 U-K6 前置的清单核对处理（kubectl get secrets -n aster-agents -o name 须恰为
# secret/guard-demo-agent）。ServiceAccount token 类 Secret 也被拒（type 必须 Opaque）。
# 新的 Agent 凭证进入 aster-agents 时，须同时改本白名单并重新评审计划 §3。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: guard-agents-secret-allowlist
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  validations:
    - expression: >-
        object.metadata.name == 'guard-demo-agent'
        && (!has(object.type) || object.type == 'Opaque')
      message: >-
        aster-agents 只允许一个 Secret：Opaque 类型的 guard-demo-agent（金丝雀 Agent token）。部署层探针身份可在本命名空间起 Pod，
        任何其它 Secret 都会被它间接读取（aster-api ADR 0054 §12 D9）。新增凭证须同时改准入白名单并重新评审。
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: guard-agents-secret-allowlist
spec:
  policyName: guard-agents-secret-allowlist
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: aster-agents
