apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    # Deploy after vault-config (TLS certs must be ready)
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: secrets-management
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.31.0
    helm:
      releaseName: vault
      values: |
        global:
          enabled: true
          tlsDisable: false

        injector:
          enabled: true
          replicas: 1
          image:
            pullPolicy: IfNotPresent
          podDisruptionBudget: {}
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 150m
          # Security hardening
          securityContext:
            pod:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            container:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        server:
          enabled: true
          image:
            repository: hashicorp/vault
            tag: "1.19.0"
            pullPolicy: IfNotPresent

          # Security hardening
          # NOTE: Vault has specific security requirements that differ from typical apps:
          # - readOnlyRootFilesystem: false - Vault writes to /vault/data (Raft) and /tmp
          #   Data storage is on a separate PVC, but rootfs write is needed for runtime
          # - IPC_LOCK capability - Required for mlock() to prevent secrets from being
          #   swapped to disk. Removing this would degrade security, not improve it.
          # See: https://developer.hashicorp.com/vault/docs/configuration#disable_mlock
          statefulSet:
            securityContext:
              pod:
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              container:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - IPC_LOCK

          # 资源缩减：单副本模式
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 400m

          # Development mode (for testing - uses in-memory storage)
          dev:
            enabled: false

          # 单副本模式：禁用 standalone，使用 HA+Raft（单节点）
          standalone:
            enabled: false

          # 单副本：移除 anti-affinity
          affinity: ""

          # HA mode with Raft storage（单副本）
          ha:
            enabled: true
            replicas: 1
            disruptionBudget:
              maxUnavailable: null
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file = "/vault/tls/tls.crt"
                  tls_key_file = "/vault/tls/tls.key"
                  telemetry {
                    unauthenticated_metrics_access = false
                  }
                }

                storage "raft" {
                  path = "/vault/data"
                  retry_join {
                    leader_api_addr = "https://vault-0.vault-internal:8200"
                    leader_ca_cert_file = "/vault/tls/tls.crt"
                    leader_client_cert_file = "/vault/tls/tls.crt"
                    leader_client_key_file = "/vault/tls/tls.key"
                  }
                }

                # ══ OCI KMS auto-unseal（k3s#488，已启用）════════════════
                #
                # 启用于迁移窗口(2026-09-29)。从 shamir 迁到 KMS 的仪式见
                # docs/488-migration-runbook.md:合并本变更 → rollout restart →
                # unseal -migrate ×3(key 取自 vault-unseal-keys Secret) →
                # 删 pod 验证自动解封 → rekey + 删 auto-unseal Secret。
                #
                # auth_type_api_key = "false" —— 走 master 节点 instance
                #   principal(dynamic-group vault-unseal-instances 匹配),不落 API key。
                # 前置已核实:KMS key、policy 两条真实 OCID、dynamic-group matching-rule。
                #
                # ⚠️ 回退:若 KMS 权限没通致 Vault 起不来,注释掉本段 seal、
                #   rollout,用 shamir key 手动 unseal(不带 -migrate)即退回。
                seal "ocikms" {
                  crypto_endpoint     = "https://f5vlukbcaaclq-crypto.kms.ap-melbourne-1.oraclecloud.com"
                  management_endpoint = "https://f5vlukbcaaclq-management.kms.ap-melbourne-1.oraclecloud.com"
                  key_id              = "ocid1.key.oc1.ap-melbourne-1.f5vlukbcaaclq.abwwkljrpdxjzlyideb675qx3nfs5h34sss4tcsejpw4uudt7koezd4qwgeq"
                  auth_type_api_key   = "false"
                }

                service_registration "kubernetes" {}

                telemetry {
                  prometheus_retention_time = "30s"
                  disable_hostname = true
                }

          # Mount TLS certificate from cert-manager
          volumes:
            - name: vault-tls-internal
              secret:
                secretName: vault-internal-tls

          volumeMounts:
            - name: vault-tls-internal
              mountPath: /vault/tls
              readOnly: true

          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: null

          auditStorage:
            enabled: true
            size: 5Gi
            storageClass: null

          # External ingress disabled - using IngressRoute instead
          # (ServersTransport annotation doesn't work reliably with Kubernetes Ingress)
          ingress:
            enabled: false

        ui:
          enabled: true
          serviceType: ClusterIP

        # Prometheus metrics
        # NOTE: ServiceMonitor disabled until monitoring stack is deployed
        # After monitoring is ready, set enabled: true and sync Vault again
        serverTelemetry:
          serviceMonitor:
            enabled: false
            # Re-enable after monitoring deployment:
            # enabled: true
            # selectors:
            #   release: prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
