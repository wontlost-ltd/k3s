# Pro demo 的 license key —— 从 Vault 拉取
# Vault path: secret/wontlost/agui-pro，property: license（由 agui-vaadin-pro 的 tools/keygen 签发）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agui-pro-license
  namespace: wontlost-agui-pro
  labels:
    app: agui-pro
    app.kubernetes.io/name: agui-pro
    app.kubernetes.io/part-of: wontlost
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agui-pro-license
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AGUI_PRO_LICENSE
      remoteRef:
        key: wontlost/agui-pro
        property: license
