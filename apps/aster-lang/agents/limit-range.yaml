# 未声明资源的容器取缺省值（配额要求每个容器都有 requests / limits），并封顶单容器用量。
apiVersion: v1
kind: LimitRange
metadata:
  name: aster-agents-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: 200m
        memory: 128Mi
