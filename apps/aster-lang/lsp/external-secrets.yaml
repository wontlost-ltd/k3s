# LSP 网关的共享 token —— 从 Vault 下发（issue #500）。
#
# ★为什么这个必须有：`lsp-server.mjs` 的 evaluateUpgrade 第 3 步是
#   **生产环境 fail-closed** —— `NODE_ENV=production`（Dockerfile.lsp:20 已设）
#   且未配 LSP_AUTH_TOKEN 时，**每一个连接都返回 401 "Token gate not configured"**。
#   即：不配这个 secret 就部署，等于上线一个拒绝所有人的服务。
#
# ★这个 token 不是密钥，也不能当密钥用：浏览器无法为 WebSocket 设置自定义头，
#   故它只能作为 query param 传递，且客户端侧是 NEXT_PUBLIC_LSP_TOKEN
#   （构建期内联，任何访客可在 devtools 读到）。它提供的只是「挡住无差别扫描」
#   这种程度的门槛。**真正的访问控制是 fail-closed 的 Origin 白名单**
#   （evaluateUpgrade 第 2 步），token 只是叠加其上的 anti-drive-by 层。
#
# 前置：需先在 Vault 里写入该值（本清单只负责下发，不负责创建）：
#   vault kv put secret/apps/aster-lsp token=<随机串>
# 并把**同一个值**配到 aster-cloud 的 NEXT_PUBLIC_LSP_TOKEN，两侧必须一致。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aster-lsp-auth
  namespace: aster-lsp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aster-lsp-auth
    creationPolicy: Owner
  data:
    - secretKey: LSP_AUTH_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-lsp
        property: token
    # 短时会话 ticket 的 HMAC 密钥（aster-cloud#657 / #728）：cloud Worker 用同一值签发
    # 60 秒一次性 ticket，网关验签。与上面的共享 token 不同，它只在服务端，不进前端产物。
    # 前置：vault kv patch secret/apps/aster-lsp ticket_secret=<openssl rand -hex 32>
    #（用 patch，put 会覆盖掉 token）；同一值 `wrangler secret put LSP_TICKET_SECRET` 写入 cloud Worker。
    - secretKey: LSP_TICKET_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: apps/aster-lsp
        property: ticket_secret
