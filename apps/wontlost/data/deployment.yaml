# Data Service Deployment
# Sample application using nginx as placeholder
# TODO: Replace nginx:alpine with actual data-service image when ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: wontlost-data
  labels:
    app: data-service
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: wontlost
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
        app.kubernetes.io/name: data-service
    spec:
      automountServiceAccountToken: false
      # R30+ audit P1：nginx 收 SIGTERM 默认立即关，给 30s 让 keep-alive
      # 连接和静态资源 in-flight 请求收尾，避免 502 spikes during rolling.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # ★按 digest 固定（issue #491）。此前是浮动 tag `nginx:alpine`，
          #   配 `imagePullPolicy: IfNotPresent` 会产生两种都不好的结果：
          #     · 已缓存该 tag 的节点 → 永远跑旧镜像，安全更新进不来；
          #     · 未缓存的新节点     → 拉到当时最新的 alpine，
          #   于是**同一份清单在不同节点上跑的是不同镜像**，且无从得知是哪个。
          #
          #   digest 取自 2026-08-30 时 docker.io/library/nginx:alpine 的
          #   manifest（registry API 的 docker-content-digest）。保留 `:alpine`
          #   标签仅为可读性——Kubernetes 在同时给出 tag 与 digest 时**以 digest 为准**。
          #
          #   ★本应用不在 ArgoCD 管理下（apps/wontlost/data/ 无 kustomization.yaml，
          #   不命中 argocd/applicationsets/wontlost.yaml 的 glob），故此改动
          #   不触发任何自动同步；下次手工 apply 时生效。
          #
          #   升级方式（不要改回浮动 tag）：
          #     crane digest nginx:alpine      # 或用 registry API 查
          #   拿到新 digest 后替换下面这一行。
          image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Inject credentials from Vault via ExternalSecrets
          envFrom:
            - secretRef:
                name: data-service-db-credentials
            - secretRef:
                name: data-service-redis-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
