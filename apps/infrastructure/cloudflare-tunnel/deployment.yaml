# Cloudflared Deployment
# Connects to Cloudflare's network and routes traffic to internal services
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: cloudflare-tunnel
spec:
  # 2 副本（原 1）：本 tunnel 是全部生产域名的唯一入口。2026-10-26 生产压测中所有请求都落在
  # 单副本的同一条边缘连接上，CPU 达 limit 的 55%、节流 9.5%，是 Traefik 之后的第二道天花板；
  # 单副本也意味着节点故障即全站不可达。两副本各自向边缘建连，由 Cloudflare 按连接分发。
  replicas: 2
  # ★先起后停（2026-09-08 加）：本 Deployment 是单副本，且此前未声明 strategy，
  #   走 k8s 默认 maxSurge=25% / maxUnavailable=25% —— 对 replicas:1 会分别
  #   **向下取整为 0** 和**向上取整为 1**，即滚更时旧 pod 先终止、新 pod 才创建。
  #   本 tunnel 是 14 个生产域名（argocd / vault / grafana / prometheus /
  #   postgres 等）的唯一入口，那个空窗期全部不可达。
  #   改成 surge=1 / unavailable=0：新 pod 就绪后才停旧 pod，升级零中断。
  #   容量：cloudflared requests 仅 cpu 25m / memory 32Mi，多起一个副本对
  #   节点（实测内存水位 67-74%）无压力。
  #   ★双跑窗口内两个副本会同时连 Cloudflare 边缘——这是 cloudflared 支持的
  #     常规形态（多副本高可用即如此），边缘按连接分发，不会冲突或重复投递。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel
        app.kubernetes.io/part-of: cloudflare-tunnel
    spec:
      # Use dedicated service account without API access
      serviceAccountName: cloudflared
      automountServiceAccountToken: false

      # 尽量把两个副本放到不同节点：单节点故障时仍有一条 tunnel 在线（软约束，节点不足时仍可同节点调度）。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudflared

      # Security hardening
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cloudflared
          # ★digest pin（k3s#523）：tag 是可变的——上游若重推同一 tag，
          #   集群会在下次拉取时静默换成不同内容，且无任何信号。
          #   digest 与 tag 并列时 digest 生效，tag 仅作可读标签。
          #   升级时：改 tag 后重新解析 digest（见 scripts/image-pin/README 或
          #   `docker buildx imagetools inspect cloudflare/cloudflared:<新tag>`）。
          #   ★2026-09-08 升级 2024.12.2 → 2026.8.3：digest 已对 Docker Hub 实测校验
          #     （tag 解析结果与此处逐字一致），manifest 含 linux/arm64。
          #     与前一次 pin 不同，**本次会真正更换运行中的镜像内容**，需重启 pod 生效。
          image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              # 300m（原 100m）：压测中 150 RPS 时已出现 CFS 节流；requests 保持 25m 不挤占调度配额。
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Health checks
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

      # Graceful shutdown
      terminationGracePeriodSeconds: 30
---
# ServiceAccount for cloudflared (no Kubernetes API access needed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: cloudflare-tunnel
automountServiceAccountToken: false
